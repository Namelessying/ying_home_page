<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板 - 流殇晓萤</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary-100: #4d6b9a;
            --primary-200: #957fdb;
            --primary-300: #e2f0ff;
            --accent-100: #e6f2ff;
            --accent-200: #6da5e3;
            --text-100: #4d6b9a;
            --text-200: #4d6b9a;
            --bg-100: #ffffff;
            --bg-200: #f5f5f5;
            --bg-300: #cccccc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, var(--primary-300) 0%, var(--accent-100) 100%);
            min-height: 100vh;
            color: var(--text-100);
            line-height: 1.5;
            font-size: 14px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 20px;
            color: white;
        }
        
        .header h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            color: var(--primary-100);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            animation: fadeInDown 0.8s ease-out;
        }
        
        .header p {
            font-size: 1rem;
            color: var(--text-200);
            opacity: 0.8;
            max-width: 700px;
            margin: 0 auto;
            animation: fadeInUp 0.8s ease-out 0.3s both;
        }
        
        .message-form {
            background: var(--bg-100);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(77, 107, 154, 0.1);
            border: 1px solid var(--primary-300);
            animation: slideInUp 0.8s ease-out 0.5s both;
        }

        /* 登录区域 */
        .login-area {
            margin-bottom: 20px;
            text-align: center;
            min-height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .user-info img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--primary-300);
        }

        .user-info span {
            font-weight: 600;
            color: var(--primary-100);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--text-100);
            font-size: 0.9rem;
        }
        
        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--primary-300);
            border-radius: 8px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            background: var(--bg-100);
            color: var(--text-100);
        }
        
        .form-group input:focus, 
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-200);
            box-shadow: 0 0 0 3px rgba(109, 165, 227, 0.1);
            transform: translateY(-1px);
        }

        .form-group input:read-only {
            background: var(--bg-200);
            cursor: not-allowed;
        }
        
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
            font-family: inherit;
        }
        
        .submit-btn {
            background: linear-gradient(135deg, var(--primary-100) 0%, var(--primary-200) 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .github-btn {
            background: #24292e;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .github-btn:hover {
            background: #1b1f23;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(36, 41, 46, 0.3);
        }
        
        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }
        
        .submit-btn:active {
            transform: translateY(-1px);
        }

        .small-btn {
            padding: 6px 14px;
            font-size: 0.8rem;
            background: var(--bg-200);
            color: var(--text-100);
            border: 1px solid var(--primary-300);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .small-btn:hover {
            background: var(--accent-100);
            transform: translateY(-1px);
        }
        
        .messages-container {
            margin-top: 40px;
            animation: fadeIn 1s ease-out 0.8s both;
        }
        
        .messages-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--bg-100);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid var(--primary-300);
            box-shadow: 0 2px 10px rgba(77, 107, 154, 0.05);
        }
        
        .messages-header h2 {
            color: var(--text-100);
            font-size: 1.3rem;
            font-weight: 600;
        }
        
        .sort-options {
            display: flex;
            gap: 8px;
        }
        
        .sort-btn {
            background: var(--bg-200);
            border: 1px solid var(--primary-300);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            color: var(--text-100);
            font-weight: 500;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }
        
        .sort-btn.active {
            background: var(--primary-100);
            color: white;
            font-weight: 600;
        }
        
        .sort-btn:hover:not(.active) {
            background: var(--accent-100);
            transform: translateY(-1px);
        }
        
        .message-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .message-card {
            background: var(--bg-100);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(77, 107, 154, 0.08);
            border: 1px solid var(--primary-300);
            transition: all 0.3s ease;
            position: relative;
            animation: slideInUp 0.5s ease-out;
        }
        
        .message-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(77, 107, 154, 0.12);
        }
        
        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--primary-300);
        }
        
        .message-author {
            font-weight: 600;
            color: var(--primary-100);
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .message-author img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid var(--primary-300);
        }
        
        .message-time {
            color: var(--text-200);
            font-size: 0.8rem;
            font-weight: 400;
        }
        
        .message-content {
            color: var(--text-100);
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }
        
        .message-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        
        .message-btn {
            background: transparent;
            border: 1px solid var(--bg-300);
            color: var(--text-200);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 6px 12px;
            border-radius: 16px;
            transition: all 0.3s ease;
            font-weight: 400;
        }
        
        .message-btn:hover {
            background: var(--bg-200);
            color: var(--text-100);
            transform: translateY(-1px);
        }
        
        .delete-btn {
            border-color: #ffb3ba;
            color: #e53e3e;
        }
        
        .delete-btn:hover {
            background: #ffb3ba;
            color: #c53030;
        }
        
        .no-messages {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-200);
            font-style: italic;
            font-size: 1rem;
            background: var(--bg-100);
            border-radius: 12px;
            border: 1px solid var(--primary-300);
        }
        
        .back-link {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 20px;
        }
        
        .back-link a {
            color: var(--primary-100);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 10px 16px;
            background: var(--bg-100);
            border-radius: 20px;
            border: 1px solid var(--primary-300);
            transition: all 0.3s ease;
        }
        
        .back-link a:hover {
            background: var(--accent-100);
            transform: translateY(-1px);
        }
        
        .back-link a svg {
            margin-right: 6px;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            background: linear-gradient(135deg, var(--primary-100), var(--accent-200));
            color: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(77, 107, 154, 0.3);
            transform: translateX(400px);
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            font-weight: 500;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        .notification.error {
            background: linear-gradient(135deg, #f56565, #e53e3e);
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 2.2rem;
            }
            
            .message-form {
                padding: 20px;
            }
            
            .message-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            
            .messages-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .sort-options {
                justify-content: center;
            }
            
            .notification {
                right: 15px;
                left: 15px;
                transform: translateY(-100px);
            }
            
            .notification.show {
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✨ 留言板 ✨</h1>
            <p>欢迎在这里留下您的想法、建议或者问候！让我们一起分享美好时光～</p>
        </div>
        
        <div class="message-form">
            <!-- 登录区域 -->
            <div class="login-area" id="login-area">
                <button id="github-login" class="submit-btn github-btn">
                    <svg height="16" viewBox="0 0 16 16" width="16" fill="white">
                        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
                    </svg>
                    使用 GitHub 登录
                </button>
            </div>

            <form id="message-form">
                <div class="form-group">
                    <label for="name">🌟 您的昵称</label>
                    <input type="text" id="name" name="name" required placeholder="请输入您的昵称" maxlength="20">
                </div>
                
                <div class="form-group">
                    <label for="message">💭 留言内容</label>
                    <textarea id="message" name="message" required placeholder="请输入您想说的话..." maxlength="500"></textarea>
                </div>
                
                <button type="submit" class="submit-btn">🚀 发布留言</button>
            </form>
        </div>
        
        <div class="messages-container">
            <div class="messages-header">
                <h2>📝 所有留言</h2>
                <div class="sort-options">
                    <button class="sort-btn active" data-sort="newest">⏰ 最新</button>
                    <button class="sort-btn" data-sort="oldest">📅 最早</button>
                </div>
            </div>
            
            <div class="message-list" id="message-list">
                <div class="no-messages" id="no-messages">
                    🌸 暂无留言，成为第一个留言的人吧！
                </div>
            </div>
        </div>
        
        <div class="back-link">
            <a href="/">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                返回主页
            </a>
        </div>
    </div>
    
    <div class="notification" id="notification">留言发布成功！</div>

    <!-- Supabase 配置（需要先填好密钥） -->
    <script src="./config.js"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <script>
        // 初始化 Supabase
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_CONFIG.URL, SUPABASE_CONFIG.ANON_KEY);

        class GuestBook {
            constructor() {
                this.currentSort = 'newest';
                this.messages = [];
                this.user = null;
                this.init();
            }
            
            async init() {
                this.bindEvents();
                
                // 检查是否已登录（处理 OAuth 回调回来的情况）
                const { data: { session } } = await _supabase.auth.getSession();
                if (session) {
                    this.user = session.user;
                    this.updateUIForUser();
                }
                
                // 监听登录状态变化
                _supabase.auth.onAuthStateChange((event, session) => {
                    if (event === 'SIGNED_IN') {
                        this.user = session.user;
                        this.updateUIForUser();
                    } else if (event === 'SIGNED_OUT') {
                        this.user = null;
                        this.updateUIForGuest();
                    }
                });
                
                await this.loadMessages();
            }
            
            bindEvents() {
                // 表单提交
                document.getElementById('message-form').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.handleSubmit();
                });
                
                // 排序按钮
                document.querySelectorAll('.sort-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.handleSort(e.target.dataset.sort);
                    });
                });
                
                // 登录按钮
                const loginBtn = document.getElementById('github-login');
                if (loginBtn) {
                    loginBtn.addEventListener('click', () => this.signInWithGitHub());
                }
            }
            
            // GitHub 登录
            async signInWithGitHub() {
                const redirectUrl = window.location.origin + window.location.pathname;
                const { error } = await _supabase.auth.signInWithOAuth({
                    provider: 'github',
                    options: {
                        redirectTo: redirectUrl
                    }
                });
                if (error) this.showNotification('登录失败: ' + error.message, true);
            }
            
            // 退出登录
            async signOut() {
                await _supabase.auth.signOut();
            }
            
            // 更新UI为已登录状态
            updateUIForUser() {
                const loginArea = document.getElementById('login-area');
                const nameInput = document.getElementById('name');
                
                const avatar = this.user.user_metadata.avatar_url || '';
                const userName = this.user.user_metadata.user_name || this.user.user_metadata.preferred_username || 'GitHub用户';
                
                loginArea.innerHTML = `
                    <div class="user-info">
                        <img src="${this.escapeHTML(avatar)}" alt="avatar" onerror="this.style.display='none'">
                        <span>${this.escapeHTML(userName)}</span>
                        <button id="logout-btn" class="small-btn">退出登录</button>
                    </div>
                `;
                document.getElementById('logout-btn').addEventListener('click', () => this.signOut());
                
                // 自动填充昵称并设为只读
                if (nameInput) {
                    nameInput.value = userName;
                    nameInput.readOnly = true;
                }
            }
            
            // 更新UI为未登录状态
            updateUIForGuest() {
                const loginArea = document.getElementById('login-area');
                const nameInput = document.getElementById('name');
                
                loginArea.innerHTML = `
                    <button id="github-login" class="submit-btn github-btn">
                        <svg height="16" viewBox="0 0 16 16" width="16" fill="white">
                            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
                        </svg>
                        使用 GitHub 登录
                    </button>
                `;
                document.getElementById('github-login').addEventListener('click', () => this.signInWithGitHub());
                
                if (nameInput) {
                    nameInput.value = '';
                    nameInput.readOnly = false;
                }
            }
            
            async handleSubmit() {
                const nameInput = document.getElementById('name');
                const messageInput = document.getElementById('message');
                
                const name = nameInput.value.trim();
                const message = messageInput.value.trim();
                
                if (!name || !message) {
                    this.showNotification('请填写昵称和留言内容！', true);
                    return;
                }
                
                if (message.length > 500) {
                    this.showNotification('留言内容不能超过500个字符！', true);
                    return;
                }
                
                await this.addMessage(name, message);
                messageInput.value = '';
                // 如果未登录，清空昵称；如果已登录，昵称保持只读
                if (!this.user) {
                    nameInput.value = '';
                }
            }
            
            async addMessage(name, message) {
                const payload = {
                    name: this.escapeHTML(name),
                    message: this.escapeHTML(message),
                    avatar: this.user ? (this.user.user_metadata.avatar_url || null) : null,
                    user_id: this.user ? this.user.id : null
                };
                
                const { error } = await _supabase
                    .from('messages')
                    .insert([payload]);
                    
                if (error) {
                    this.showNotification('发布失败: ' + error.message, true);
                    return;
                }
                
                this.showNotification('留言发布成功！ 🎉');
                await this.loadMessages();
            }
            
            async deleteMessage(id) {
                if (!confirm('确定要删除这条留言吗？')) return;
                
                const { error } = await _supabase
                    .from('messages')
                    .delete()
                    .eq('id', id);
                    
                if (error) {
                    this.showNotification('删除失败', true);
                    return;
                }
                
                await this.loadMessages();
                this.showNotification('留言已删除！');
            }
            
            handleSort(sortType) {
                if (sortType === this.currentSort) return;
                this.currentSort = sortType;
                
                document.querySelectorAll('.sort-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.sort === sortType);
                });
                
                this.renderMessages();
            }
            
            async loadMessages() {
                const { data, error } = await _supabase
                    .from('messages')
                    .select('*')
                    .order('created_at', { ascending: false });
                    
                if (error) {
                    console.error('加载留言失败:', error);
                    this.showNotification('加载留言失败', true);
                    this.messages = [];
                } else {
                    this.messages = data || [];
                }
                
                this.renderMessages();
            }
            
            renderMessages() {
                const messageList = document.getElementById('message-list');
                
                messageList.innerHTML = '';
                
                if (this.messages.length === 0) {
                    messageList.innerHTML = `
                        <div class="no-messages">
                            🌸 暂无留言，成为第一个留言的人吧！
                        </div>
                    `;
                    return;
                }
                
                const sortedMessages = [...this.messages].sort((a, b) => {
                    const aTime = new Date(a.created_at).getTime();
                    const bTime = new Date(b.created_at).getTime();
                    return this.currentSort === 'newest' ? bTime - aTime : aTime - bTime;
                });
                
                sortedMessages.forEach((message, index) => {
                    const card = this.createMessageCard(message);
                    card.style.animationDelay = `${index * 0.1}s`;
                    messageList.appendChild(card);
                });
            }
            
            createMessageCard(message) {
                const card = document.createElement('div');
                card.className = 'message-card';
                
                const date = new Date(message.created_at);
                const formattedDate = this.formatDate(date);
                
                const avatarHtml = message.avatar 
                    ? `<img src="${this.escapeHTML(message.avatar)}" alt="avatar" onerror="this.style.display='none'">`
                    : '👤';
                
                card.innerHTML = `
                    <div class="message-header">
                        <div class="message-author">
                            ${avatarHtml}
                            ${this.escapeHTML(message.name)}
                        </div>
                        <div class="message-time">${formattedDate}</div>
                    </div>
                    <div class="message-content">${message.message}</div>
                    <div class="message-actions">
                        <button class="message-btn delete-btn">🗑️ 删除</button>
                    </div>
                `;
                
                card.querySelector('.delete-btn').addEventListener('click', () => {
                    this.deleteMessage(message.id);
                });
                
                return card;
            }
            
            formatDate(date) {
                const now = new Date();
                const diff = now - date;
                
                if (diff < 60000) return '刚刚';
                if (diff < 3600000) return `${Math.floor(diff / 60000)}分钟前`;
                if (diff < 86400000) return `${Math.floor(diff / 3600000)}小时前`;
                if (diff < 2592000000) return `${Math.floor(diff / 86400000)}天前`;
                
                return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日 ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
            }
            
            showNotification(message, isError = false) {
                const notification = document.getElementById('notification');
                notification.textContent = message;
                notification.className = `notification${isError ? ' error' : ''}`;
                
                requestAnimationFrame(() => {
                    notification.classList.add('show');
                });
                
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            }
            
            escapeHTML(str) {
                if (!str) return '';
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            new GuestBook();
        });
    </script>
</body>
</html>
