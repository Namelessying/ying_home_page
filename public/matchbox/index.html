<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的赛博火柴盒</title>
    <style>
        /* 基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Times New Roman', serif;
            background-color: #fff;
            color: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* 页面容器 */
        .page {
            display: none;
            width: 100%;
            max-width: 800px;
            padding: 40px 20px;
            min-height: 100vh;
        }
        
        .page.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* 首页 */
        #home {
            justify-content: center;
            text-align: center;
        }
        
        #home h1 {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 60px;
            letter-spacing: 4px;
        }
        
        .btn {
            padding: 16px 48px;
            background: transparent;
            border: 1px solid #000;
            font-size: 18px;
            letter-spacing: 2px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background: #000;
            color: #fff;
        }
        
        /* 年龄测试页 */
        #age-test {
            justify-content: center;
        }
        
        .question-container {
            width: 100%;
            text-align: center;
        }
        
        .question {
            font-size: 20px;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
        
        .options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
        }
        
        .option {
            padding: 12px 24px;
            border: 1px solid #000;
            background: transparent;
            font-size: 16px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
        }
        
        .option:hover, .option.selected {
            background: #000;
            color: #fff;
        }
        
        .year-input {
            padding: 12px 24px;
            border: 1px solid #000;
            font-size: 18px;
            font-family: inherit;
            text-align: center;
            width: 120px;
        }
        
        /* 测试结果页 */
        #age-result {
            justify-content: center;
            text-align: center;
        }
        
        .age-container {
            display: flex;
            align-items: center;
            margin-bottom: 50px;
        }
        
        .age-window {
            height: 140px;
            overflow: hidden;
            position: relative;
            width: 140px;
        }
        
        .age-fade-top, .age-fade-bottom {
            position: absolute;
            left: 0;
            right: 0;
            height: 35px;
            z-index: 2;
        }
        
        .age-fade-top {
            top: 0;
            background: linear-gradient(to bottom, #fff, transparent);
        }
        
        .age-fade-bottom {
            bottom: 0;
            background: linear-gradient(to top, #fff, transparent);
        }
        
        .age-numbers {
            transform: translateY(0px);
            transition: transform 3.2s cubic-bezier(0.12, 0.8, 0.3, 1);
        }
        
        .age-number {
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 120px;
            font-weight: bold;
            line-height: 1;
        }
        
        .age-suffix {
            font-size: 40px;
            font-weight: bold;
            margin-left: 5px;
            transform: translateY(10px);
            opacity: 0;
            transition: opacity 0.5s;
        }
        
        .stats {
            margin-top: 30px;
            opacity: 0;
            transition: opacity 0.8s;
        }
        
        .stats div {
            font-size: 20px;
            letter-spacing: 2px;
            margin-top: 10px;
        }
        
        .quote {
            margin-top: 30px;
            font-size: 16px;
            letter-spacing: 2px;
            opacity: 0;
            transition: opacity 0.8s;
            font-style: italic;
        }
        
        .btn-container {
            margin-top: 40px;
            opacity: 0;
            transition: opacity 0.5s;
        }
        
        /* 遗产列表页 */
        #heritage-list {
            padding-top: 20px;
        }
        
        .header {
            width: 100%;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        
        .stats-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
        
        .heritage-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            margin-bottom: 30px;
        }
        
        .heritage-card {
            border: 1px solid #000;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .heritage-card:hover {
            transform: translateY(-5px);
            box-shadow: 5px 5px 0 #000;
        }
        
        .heritage-icon {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .heritage-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .heritage-id {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
        
        .heritage-info {
            font-size: 14px;
            margin-bottom: 5px;
        }
        
        .heritage-epitaph {
            font-size: 14px;
            font-style: italic;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }
        
        .add-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border: 1px solid #000;
            background: #fff;
            font-size: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .add-btn:hover {
            background: #000;
            color: #fff;
        }
        
        /* 导航栏 */
        .nav-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 15px;
            background: #fff;
            border-bottom: 1px solid #000;
            z-index: 100;
        }
        
        .nav-item {
            padding: 8px 16px;
            cursor: pointer;
            font-size: 16px;
            letter-spacing: 1px;
            transition: all 0.3s;
        }
        
        .nav-item:hover, .nav-item.active {
            font-weight: bold;
            border-bottom: 2px solid #000;
        }
        
        /* 遗产详情抽屉 */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 200;
            display: none;
        }
        
        .drawer {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            max-width: 90vw;
            height: 100vh;
            background: #fff;
            border-left: 1px solid #000;
            padding: 30px;
            overflow-y: auto;
            transition: right 0.3s;
            z-index: 201;
        }
        
        .drawer.open {
            right: 0;
        }
        
        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .drawer-title {
            font-size: 24px;
            font-weight: bold;
        }
        
        .drawer-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            font-family: inherit;
        }
        
        .drawer-field {
            margin-bottom: 20px;
        }
        
        .drawer-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }
        
        .drawer-value {
            font-size: 16px;
        }
        
        .drawer-actions {
            margin-top: 30px;
            display: flex;
            gap: 15px;
        }
        
        /* 赛博墓碑页 */
        #tombstone {
            background: #000;
            color: #fff;
            min-height: 100vh;
            padding-top: 80px;
        }
        
        .tombstone-container {
            text-align: center;
            padding: 40px;
        }
        
        .tombstone-svg {
            max-width: 300px;
            margin: 0 auto 30px;
        }
        
        .tombstone-info {
            margin-bottom: 20px;
        }
        
        .tombstone-name {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .tombstone-id {
            font-size: 18px;
            margin-bottom: 10px;
        }
        
        .tombstone-years {
            font-size: 16px;
            margin-bottom: 20px;
        }
        
        .tombstone-epitaph {
            font-size: 18px;
            font-style: italic;
            margin-bottom: 30px;
        }
        
        .flowers {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        
        .flower {
            font-size: 30px;
            cursor: pointer;
            opacity: 0.3;
            transition: opacity 0.3s;
        }
        
        .flower.lit {
            opacity: 1;
        }
        
        /* 遗嘱页 */
        #will {
            padding-top: 80px;
        }
        
        .will-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .will-header h1 {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .will-content {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 40px;
            border: 1px solid #000;
        }
        
        .will-title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
        }
        
        .will-date {
            text-align: right;
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
        }
        
        .will-heritage {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        
        .will-heritage-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .will-heritage-info {
            font-size: 14px;
            color: #666;
        }
        
        .will-total {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #000;
        }
        
        .will-signature {
            margin-top: 40px;
            text-align: right;
        }
        
        .will-signature-line {
            width: 200px;
            border-bottom: 1px solid #000;
            margin-left: auto;
            margin-top: 10px;
        }
        
        .will-actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        
        /* 设置页 */
        #settings {
            padding-top: 80px;
        }
        
        .settings-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .settings-header h1 {
            font-size: 28px;
            font-weight: bold;
        }
        
        .settings-section {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 30px;
        }
        
        .settings-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #000;
        }
        
        .theme-options {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .theme-option {
            padding: 10px 20px;
            border: 1px solid #000;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .theme-option:hover, .theme-option.active {
            background: #000;
            color: #fff;
        }
        
        .settings-actions {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        /* 表单样式 */
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #000;
            font-family: inherit;
            font-size: 16px;
        }
        
        .form-textarea {
            height: 100px;
            resize: vertical;
        }
        
        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        /* 像素主题 */
        body.pixel {
            font-family: 'Courier New', monospace;
        }
        
        body.pixel .btn, body.pixel .option, body.pixel .heritage-card, 
        body.pixel .form-input, body.pixel .form-select, body.pixel .form-textarea {
            border-width: 3px;
            border-style: solid;
        }
        
        /* 响应式 */
        @media (max-width: 600px) {
            .heritage-grid {
                grid-template-columns: 1fr;
            }
            
            .drawer {
                width: 100%;
            }
            
            .tombstone-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- 首页 -->
    <div id="home" class="page active">
        <h1>我的赛博火柴盒</h1>
        <button class="btn" onclick="startAgeTest()">开始整理你的数字遗产</button>
    </div>
    
    <!-- 年龄测试页 -->
    <div id="age-test" class="page">
        <div class="question-container" id="question-container"></div>
    </div>
    
    <!-- 测试结果页 -->
    <div id="age-result" class="page">
        <div style="font-size: 18px; letter-spacing: 4px; margin-bottom: 60px;">你的互联网年龄</div>
        <div class="age-container">
            <div class="age-window">
                <div class="age-fade-top"></div>
                <div class="age-fade-bottom"></div>
                <div class="age-numbers" id="age-numbers"></div>
            </div>
            <div class="age-suffix" id="age-suffix">岁</div>
        </div>
        <div class="stats" id="result-stats">
            <div>你经历过 <span id="dead-count">0</span> 个已死平台</div>
            <div>你的数字足迹遍布 <span id="platform-count">0</span> 个平台</div>
        </div>
        <div class="quote" id="result-quote"></div>
        <div class="btn-container">
            <button class="btn" onclick="showHeritageList()">开始整理你的火柴盒</button>
        </div>
    </div>
    
    <!-- 遗产列表页 -->
    <div id="heritage-list" class="page">
        <div class="nav-bar">
            <div class="nav-item active" onclick="showPage('heritage-list')">火柴盒</div>
            <div class="nav-item" onclick="showPage('will')">遗嘱</div>
            <div class="nav-item" onclick="showPage('settings')">设置</div>
        </div>
        
        <div class="header">
            <h1>我的赛博火柴盒</h1>
            <div class="stats-bar">
                <div id="heritage-count">0 件遗产</div>
                <div id="total-value">总估值: ¥0</div>
                <div id="internet-age">互联网年龄: 0 岁</div>
            </div>
        </div>
        
        <div class="heritage-grid" id="heritage-grid"></div>
        
        <button class="add-btn" onclick="showAddForm()">+</button>
    </div>
    
    <!-- 遗产详情抽屉 -->
    <div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
    <div class="drawer" id="drawer">
        <div class="drawer-header">
            <div class="drawer-title" id="drawer-title">遗产详情</div>
            <button class="drawer-close" onclick="closeDrawer()">×</button>
        </div>
        <div id="drawer-content"></div>
    </div>
    
    <!-- 添加遗产表单 -->
    <div id="add-form" class="page">
        <div class="header">
            <h1>添加遗产</h1>
        </div>
        <div style="width: 100%; max-width: 600px;">
            <div class="form-group">
                <label class="form-label">平台名称 *</label>
                <input type="text" class="form-input" id="form-platform" placeholder="微博、QQ、Steam...">
            </div>
            <div class="form-group">
                <label class="form-label">账号ID</label>
                <input type="text" class="form-input" id="form-id" placeholder="@用户名">
            </div>
            <div class="form-group">
                <label class="form-label">注册时间</label>
                <input type="number" class="form-input" id="form-year" placeholder="2016" min="1990" max="2024">
            </div>
            <div class="form-group">
                <label class="form-label">账号类型</label>
                <select class="form-select" id="form-type">
                    <option value="">请选择</option>
                    <option value="社交">社交</option>
                    <option value="游戏">游戏</option>
                    <option value="创作">创作</option>
                    <option value="工具">工具</option>
                    <option value="订阅">订阅</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">估值 (元)</label>
                <input type="number" class="form-input" id="form-value" placeholder="0">
            </div>
            <div class="form-group">
                <label class="form-label">继承人</label>
                <input type="text" class="form-input" id="form-heir" placeholder="姓名或联系方式">
            </div>
            <div class="form-group">
                <label class="form-label">处置方式</label>
                <select class="form-select" id="form-disposal">
                    <option value="">请选择</option>
                    <option value="注销">注销</option>
                    <option value="转交">转交</option>
                    <option value="冻结">冻结</option>
                    <option value="保留">保留</option>
                    <option value="随缘">随缘</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">墓志铭 (限30字)</label>
                <input type="text" class="form-input" id="form-epitaph" placeholder="一句话告别" maxlength="30">
            </div>
            <div class="form-actions">
                <button class="btn" onclick="saveHeritage()">保存</button>
                <button class="btn" onclick="showPage('heritage-list')">取消</button>
            </div>
        </div>
    </div>
    
    <!-- 赛博墓碑页 -->
    <div id="tombstone" class="page">
        <div class="nav-bar">
            <div class="nav-item" onclick="showPage('heritage-list')">火柴盒</div>
            <div class="nav-item" onclick="showPage('will')">遗嘱</div>
            <div class="nav-item" onclick="showPage('settings')">设置</div>
        </div>
        <div class="tombstone-container" id="tombstone-content"></div>
    </div>
    
    
    <!-- 遗嘱页 -->
    <div id="will" class="page">
        <div class="nav-bar">
            <div class="nav-item" onclick="showPage('heritage-list')">火柴盒</div>
            <div class="nav-item active" onclick="showPage('will')">遗嘱</div>
            <div class="nav-item" onclick="showPage('settings')">设置</div>
        </div>
        <div class="will-header">
            <h1>数字遗嘱</h1>
        </div>
        <div class="will-content" id="will-content"></div>
        <div class="will-actions">
            <button class="btn" onclick="exportWill('image')">导出长图</button>
            <button class="btn" onclick="exportWill('pdf')">导出PDF</button>
        </div>
    </div>
    
    <!-- 设置页 -->
    <div id="settings" class="page">
        <div class="nav-bar">
            <div class="nav-item" onclick="showPage('heritage-list')">火柴盒</div>
            <div class="nav-item" onclick="showPage('will')">遗嘱</div>
            <div class="nav-item active" onclick="showPage('settings')">设置</div>
        </div>
        <div class="settings-header">
            <h1>设置</h1>
        </div>
        <div class="settings-section">
            <div class="settings-title">主题</div>
            <div class="theme-options">
                <div class="theme-option active" onclick="setTheme('light')">极简黑白</div>
                <div class="theme-option" onclick="setTheme('pixel')">像素复古</div>
            </div>
        </div>
        <div class="settings-section">
            <div class="settings-title">数据</div>
            <div class="settings-actions">
                <button class="btn" onclick="exportData()">导出数据备份</button>
                <button class="btn" onclick="importData()">导入数据备份</button>
                <button class="btn" onclick="clearData()">清除所有数据</button>
            </div>
        </div>
        <div class="settings-section">
            <div class="settings-title">重新测试</div>
            <button class="btn" onclick="resetAgeTest()">重新进行年龄测试</button>
        </div>
    </div>
    
    <!-- 隐藏的文件输入 -->
    <input type="file" id="file-input" style="display: none;" accept=".json" onchange="handleFileImport(event)">
    
    <script>
        // 数据存储
        let appData = {
            ageTestCompleted: false,
            internetAge: 0,
            deadPlatforms: 0,
            platformCount: 0,
            heritages: [],
            theme: 'light',
            flowerStates: {}
        };
        
        // 已死平台数据
        const deadPlatformsList = [
            { name: '人人网', years: '2005 — 2018', epitaph: '中国最早的实名社交平台', startYear: 2005 },
            { name: '开心网', years: '2008 — 2016', epitaph: '偷菜的时代过去了', startYear: 2008 },
            { name: 'MSN', years: '1999 — 2014', epitaph: '一代人的即时通讯记忆', startYear: 1999 },
            { name: '天涯论坛', years: '1999 — 2023', epitaph: '一代人的青春记忆', startYear: 1999 },
            { name: '猫扑', years: '1997 — 2020', epitaph: '网络流行语的发源地', startYear: 1997 },
            { name: '西祠胡同', years: '1998 — 2022', epitaph: '南京人的网络家园', startYear: 1998 },
            { name: '凯迪社区', years: '1998 — 2021', epitaph: '曾经的舆论场', startYear: 1998 },
            { name: '网易博客', years: '2006 — 2018', epitaph: '博客时代的终结', startYear: 2006 },
            { name: 'Google+', years: '2011 — 2019', epitaph: '谷歌的社交梦', startYear: 2011 },
            { name: 'Vine', years: '2013 — 2017', epitaph: '短视频的先驱', startYear: 2013 }
        ];
        
        // 年龄测试问题
        const questions = [
            {
                question: '你还记得你什么时候接触互联网吗？',
                type: 'year',
                options: null
            },
            {
                question: '你玩过最久的账号是哪个？',
                type: 'single',
                options: ['QQ', '微博', '微信', '邮箱', '贴吧', '豆瓣', 'B站', '抖音', '小红书', '知乎', 'Steam', '其他']
            },
            {
                question: '你用过/玩过这些吗？',
                type: 'multi',
                options: ['人人网', '开心网', 'MSN', '天涯论坛', '猫扑', '西祠胡同', '凯迪社区', '水木清华', '虎扑BBS', 'NGA', '贴吧', '豆瓣小组', '4399', '网易博客', 'Google+', 'Vine', '以上都没用过']
            },
            {
                question: '你注销过账号吗？',
                type: 'single',
                options: ['从来没有', '偶尔几个', '经常清理', '不记得了']
            }
        ];
        
        let currentQuestion = 0;
        let testAnswers = [];
        let editingId = null;
        
        // 初始化
        function init() {
            loadData();
            if (appData.ageTestCompleted) {
                showHeritageList();
            }
            applyTheme();
        }
        
        // 加载数据
        function loadData() {
            const saved = localStorage.getItem('cyberMatchbox');
            if (saved) {
                appData = JSON.parse(saved);
            }
        }
        
        // 保存数据
        function saveData() {
            localStorage.setItem('cyberMatchbox', JSON.stringify(appData));
        }
        
        // 显示页面
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            
            if (pageId === 'heritage-list') {
                renderHeritageList();
            } else if (pageId === 'will') {
                renderWill();
            }
        }
        
        // 开始年龄测试
        function startAgeTest() {
            currentQuestion = 0;
            testAnswers = [];
            showPage('age-test');
            renderQuestion();
        }
        
        // 渲染问题
        function renderQuestion() {
            const q = questions[currentQuestion];
            const container = document.getElementById('question-container');
            
            let html = `<div class="question">${q.question}</div>`;
            
            if (q.type === 'year') {
                html += `<input type="number" class="year-input" id="year-input" min="1990" max="2024" placeholder="2010">
                         <div style="margin-top: 20px;">
                            <button class="btn" onclick="nextQuestion()">下一题</button>
                         </div>`;
            } else if (q.type === 'single') {
                html += `<div class="options">`;
                q.options.forEach(opt => {
                    html += `<div class="option" onclick="selectSingle(this, '${opt}')">${opt}</div>`;
                });
                html += `</div>`;
            } else if (q.type === 'multi') {
                html += `<div class="options">`;
                q.options.forEach(opt => {
                    html += `<div class="option" onclick="toggleMulti(this, '${opt}')">${opt}</div>`;
                });
                html += `</div>
                         <button class="btn" onclick="nextQuestion()">下一题</button>`;
            }
            
            container.innerHTML = html;
        }
        
        // 单选
        function selectSingle(el, value) {
            document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
            testAnswers[currentQuestion] = value;
            setTimeout(() => nextQuestion(), 300);
        }
        
        // 多选
        function toggleMulti(el, value) {
            el.classList.toggle('selected');
            if (!testAnswers[currentQuestion]) {
                testAnswers[currentQuestion] = [];
            }
            const index = testAnswers[currentQuestion].indexOf(value);
            if (index === -1) {
                testAnswers[currentQuestion].push(value);
            } else {
                testAnswers[currentQuestion].splice(index, 1);
            }
        }
        
        // 下一题
        function nextQuestion() {
            if (currentQuestion === 0) {
                const yearInput = document.getElementById('year-input');
                if (!yearInput.value) {
                    alert('请输入年份');
                    return;
                }
                testAnswers[0] = parseInt(yearInput.value);
            }
            
            currentQuestion++;
            if (currentQuestion < questions.length) {
                renderQuestion();
            } else {
                calculateAge();
                showAgeResult();
            }
        }
        
        // 计算年龄
        function calculateAge() {
            const startYear = testAnswers[0];
            appData.internetAge = new Date().getFullYear() - startYear;
            
            // 计算已死平台数
            const usedPlatforms = testAnswers[2] || [];
            appData.deadPlatforms = usedPlatforms.filter(p => 
                deadPlatformsList.some(d => d.name === p)
            ).length;
            
            // 计算平台数
            appData.platformCount = usedPlatforms.length;
            if (testAnswers[1] && !usedPlatforms.includes(testAnswers[1])) {
                appData.platformCount++;
            }
            
            appData.ageTestCompleted = true;
            saveData();
        }
        
        // 显示年龄结果
        function showAgeResult() {
            showPage('age-result');
            
            // 生成数字序列
            const numbersContainer = document.getElementById('age-numbers');
            let numbersHtml = '';
            for (let i = 1; i <= 50; i++) {
                numbersHtml += `<div class="age-number">${i}</div>`;
            }
            for (let i = 1; i <= appData.internetAge; i++) {
                numbersHtml += `<div class="age-number">${i}</div>`;
            }
            numbersContainer.innerHTML = numbersHtml;
            
            // 动画
            const totalItems = 50 + appData.internetAge;
            const scrollDistance = (totalItems - 1) * 140;
            
            setTimeout(() => {
                numbersContainer.style.transform = `translateY(-${scrollDistance}px)`;
            }, 600);
            
            setTimeout(() => {
                document.getElementById('age-suffix').style.opacity = '1';
            }, 4000);
            
            setTimeout(() => {
                document.getElementById('result-stats').style.opacity = '1';
                document.getElementById('dead-count').textContent = appData.deadPlatforms;
                document.getElementById('platform-count').textContent = appData.platformCount;
            }, 4500);
            
            setTimeout(() => {
                document.getElementById('result-quote').style.opacity = '1';
                document.getElementById('result-quote').textContent = getQuote();
            }, 5300);
            
            setTimeout(() => {
                document.querySelector('#age-result .btn-container').style.opacity = '1';
            }, 5800);
        }
        
        // 获取评语
        function getQuote() {
            const age = appData.internetAge;
            if (age >= 15) return '你是互联网活化石，经历过太多平台的生死轮回';
            if (age >= 10) return '你是赛博黄金时代的见证者';
            if (age >= 5) return '你的数字人生才刚开始，但已经错过了最有趣的那些年';
            return '你是互联网新人，一切都是新鲜的';
        }
        
        // 显示遗产列表
        function showHeritageList() {
            showPage('heritage-list');
            renderHeritageList();
        }
        
        // 渲染遗产列表
        function renderHeritageList() {
            const grid = document.getElementById('heritage-grid');
            let html = '';
            
            appData.heritages.forEach(h => {
                html += `<div class="heritage-card" onclick="showHeritageDetail('${h.id}')">
                    <div class="heritage-icon">${getPlatformIcon(h.platform)}</div>
                    <div class="heritage-name">${h.platform}</div>
                    <div class="heritage-id">${h.accountId || '—'}</div>
                    <div class="heritage-info">${h.type || '—'} · ${h.year || '—'}</div>
                    <div class="heritage-info">估值: ¥${h.value || 0}</div>
                    ${h.epitaph ? `<div class="heritage-epitaph">「${h.epitaph}」</div>` : ''}
                </div>`;
            });
            
            grid.innerHTML = html;
            
            // 更新统计
            document.getElementById('heritage-count').textContent = `${appData.heritages.length} 件遗产`;
            const totalValue = appData.heritages.reduce((sum, h) => sum + (parseInt(h.value) || 0), 0);
            document.getElementById('total-value').textContent = `总估值: ¥${totalValue.toLocaleString()}`;
            document.getElementById('internet-age').textContent = `互联网年龄: ${appData.internetAge} 岁`;
        }
        
        // 获取平台图标
        function getPlatformIcon(platform) {
            const icons = {
                '微博': '🐦', 'QQ': '💬', '微信': '💚', 'B站': '📺',
                '抖音': '🎵', '小红书': '📕', '知乎': '🔵', 'Steam': '🎮',
                '贴吧': '📌', '豆瓣': '🎬', '邮箱': '📧', '抖音': '🎵'
            };
            return icons[platform] || '📱';
        }
        
        // 显示添加表单
        function showAddForm() {
            editingId = null;
            document.getElementById('form-platform').value = '';
            document.getElementById('form-id').value = '';
            document.getElementById('form-year').value = '';
            document.getElementById('form-type').value = '';
            document.getElementById('form-value').value = '';
            document.getElementById('form-heir').value = '';
            document.getElementById('form-disposal').value = '';
            document.getElementById('form-epitaph').value = '';
            showPage('add-form');
        }
        
        // 保存遗产
        function saveHeritage() {
            const platform = document.getElementById('form-platform').value.trim();
            if (!platform) {
                alert('请输入平台名称');
                return;
            }
            
            const heritage = {
                id: editingId || Date.now().toString(),
                platform: platform,
                accountId: document.getElementById('form-id').value.trim(),
                year: document.getElementById('form-year').value,
                type: document.getElementById('form-type').value,
                value: document.getElementById('form-value').value,
                heir: document.getElementById('form-heir').value.trim(),
                disposal: document.getElementById('form-disposal').value,
                epitaph: document.getElementById('form-epitaph').value.trim()
            };
            
            if (editingId) {
                const index = appData.heritages.findIndex(h => h.id === editingId);
                if (index !== -1) {
                    appData.heritages[index] = heritage;
                }
            } else {
                appData.heritages.push(heritage);
            }
            
            saveData();
            showHeritageList();
        }
        
        // 显示遗产详情
        function showHeritageDetail(id) {
            const heritage = appData.heritages.find(h => h.id === id);
            if (!heritage) return;
            
            document.getElementById('drawer-title').textContent = heritage.platform;
            
            let html = `
                <div class="drawer-field">
                    <div class="drawer-label">账号ID</div>
                    <div class="drawer-value">${heritage.accountId || '—'}</div>
                </div>
                <div class="drawer-field">
                    <div class="drawer-label">注册时间</div>
                    <div class="drawer-value">${heritage.year || '—'}</div>
                </div>
                <div class="drawer-field">
                    <div class="drawer-label">账号类型</div>
                    <div class="drawer-value">${heritage.type || '—'}</div>
                </div>
                <div class="drawer-field">
                    <div class="drawer-label">估值</div>
                    <div class="drawer-value">¥${heritage.value || 0}</div>
                </div>
                <div class="drawer-field">
                    <div class="drawer-label">继承人</div>
                    <div class="drawer-value">${heritage.heir || '—'}</div>
                </div>
                <div class="drawer-field">
                    <div class="drawer-label">处置方式</div>
                    <div class="drawer-value">${heritage.disposal || '—'}</div>
                </div>
                ${heritage.epitaph ? `
                <div class="drawer-field">
                    <div class="drawer-label">墓志铭</div>
                    <div class="drawer-value" style="font-style: italic;">「${heritage.epitaph}」</div>
                </div>` : ''}
                <div class="drawer-actions">
                    <button class="btn" onclick="editHeritage('${id}')">编辑</button>
                    <button class="btn" onclick="deleteHeritage('${id}')">删除</button>
                    <button class="btn" onclick="showTombstone('${id}')">生成墓碑</button>
                </div>
            `;
            
            document.getElementById('drawer-content').innerHTML = html;
            document.getElementById('drawer-overlay').style.display = 'block';
            document.getElementById('drawer').classList.add('open');
        }
        
        // 关闭抽屉
        function closeDrawer() {
            document.getElementById('drawer-overlay').style.display = 'none';
            document.getElementById('drawer').classList.remove('open');
        }
        
        // 编辑遗产
        function editHeritage(id) {
            const heritage = appData.heritages.find(h => h.id === id);
            if (!heritage) return;
            
            editingId = id;
            document.getElementById('form-platform').value = heritage.platform;
            document.getElementById('form-id').value = heritage.accountId || '';
            document.getElementById('form-year').value = heritage.year || '';
            document.getElementById('form-type').value = heritage.type || '';
            document.getElementById('form-value').value = heritage.value || '';
            document.getElementById('form-heir').value = heritage.heir || '';
            document.getElementById('form-disposal').value = heritage.disposal || '';
            document.getElementById('form-epitaph').value = heritage.epitaph || '';
            
            closeDrawer();
            showPage('add-form');
        }
        
        // 删除遗产
        function deleteHeritage(id) {
            if (confirm('确定要删除这个遗产吗？')) {
                appData.heritages = appData.heritages.filter(h => h.id !== id);
                saveData();
                closeDrawer();
                renderHeritageList();
            }
        }
        
        // 显示墓碑
        function showTombstone(id) {
            const heritage = appData.heritages.find(h => h.id === id);
            if (!heritage) return;
            
            const container = document.getElementById('tombstone-content');
            const flowerState = appData.flowerStates[id] || [false, false, false];
            
            let html = `
                <div class="tombstone-svg">
                    <svg width="200" height="250" viewBox="0 0 200 250">
                        <path d="M20 250 L20 80 Q20 20 100 20 Q180 20 180 80 L180 250 Z" 
                              fill="none" stroke="#fff" stroke-width="2"/>
                    </svg>
                </div>
                <div class="tombstone-info">
                    <div class="tombstone-name">${heritage.platform}</div>
                    <div class="tombstone-id">${heritage.accountId || ''}</div>
                    <div class="tombstone-years">${heritage.year ? `${heritage.year} — ${new Date().getFullYear()}` : ''}</div>
                    <div class="tombstone-epitaph">${heritage.epitaph ? `「${heritage.epitaph}」` : ''}</div>
                </div>
                <div class="flowers">
                    <div class="flower ${flowerState[0] ? 'lit' : ''}" onclick="toggleFlower('${id}', 0)">🌹</div>
                    <div class="flower ${flowerState[1] ? 'lit' : ''}" onclick="toggleFlower('${id}', 1)">🌹</div>
                    <div class="flower ${flowerState[2] ? 'lit' : ''}" onclick="toggleFlower('${id}', 2)">🌹</div>
                </div>
                <div style="margin-top: 40px;">
                    <button class="btn" onclick="showHeritageList()">返回</button>
                </div>
            `;
            
            container.innerHTML = html;
            closeDrawer();
            showPage('tombstone');
        }
        
        // 切换献花
        function toggleFlower(id, index) {
            if (!appData.flowerStates[id]) {
                appData.flowerStates[id] = [false, false, false];
            }
            appData.flowerStates[id][index] = !appData.flowerStates[id][index];
            saveData();
            showTombstone(id);
        }
        
        // 渲染遗嘱
        function renderWill() {
            const content = document.getElementById('will-content');
            const totalValue = appData.heritages.reduce((sum, h) => sum + (parseInt(h.value) || 0), 0);
            
            let html = `
                <div class="will-title">数字遗嘱</div>
                <div class="will-date">生成日期: ${new Date().toLocaleDateString('zh-CN')}</div>
            `;
            
            appData.heritages.forEach(h => {
                html += `
                    <div class="will-heritage">
                        <div class="will-heritage-name">${h.platform}</div>
                        <div class="will-heritage-info">
                            账号: ${h.accountId || '—'} | 类型: ${h.type || '—'} | 估值: ¥${h.value || 0}
                        </div>
                        <div class="will-heritage-info">
                            继承人: ${h.heir || '—'} | 处置方式: ${h.disposal || '—'}
                        </div>
                    </div>
                `;
            });
            
            html += `
                <div class="will-total">总估值: ¥${totalValue.toLocaleString()}</div>
                <div class="will-signature">
                    <div>立遗嘱人</div>
                    <div class="will-signature-line"></div>
                </div>
            `;
            
            content.innerHTML = html;
        }
        
        // 导出遗嘱
        function exportWill(format) {
            alert(`${format === 'image' ? '长图' : 'PDF'}导出功能开发中...`);
        }
        
        // 设置主题
        function setTheme(theme) {
            appData.theme = theme;
            saveData();
            applyTheme();
            
            document.querySelectorAll('.theme-option').forEach(opt => {
                opt.classList.remove('active');
            });
            event.target.classList.add('active');
        }
        
        // 应用主题
        function applyTheme() {
            document.body.className = appData.theme;
        }
        
        // 导出数据
        function exportData() {
            const dataStr = JSON.stringify(appData, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '我的赛博火柴盒_备份.json';
            a.click();
            URL.revokeObjectURL(url);
        }
        
        // 导入数据
        function importData() {
            document.getElementById('file-input').click();
        }
        
        // 处理文件导入
        function handleFileImport(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (confirm('导入将覆盖现有数据，确定继续吗？')) {
                        appData = imported;
                        saveData();
                        alert('导入成功！');
                        location.reload();
                    }
                } catch (err) {
                    alert('文件格式错误');
                }
            };
            reader.readAsText(file);
        }
        
        // 清除数据
        function clearData() {
            if (confirm('确定要清除所有数据吗？此操作不可恢复！')) {
                localStorage.removeItem('cyberMatchbox');
                location.reload();
            }
        }
        
        // 重置年龄测试
        function resetAgeTest() {
            if (confirm('确定要重新进行年龄测试吗？')) {
                appData.ageTestCompleted = false;
                appData.internetAge = 0;
                appData.deadPlatforms = 0;
                appData.platformCount = 0;
                saveData();
                showPage('home');
            }
        }
        
        // 初始化
        init();
    </script>
</body>
</html>
