<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猪猪认证 Pro ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@300;400;500;700;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  :root {
    --bg: #FFF6F0;
    --accent: #FF8FAB;
    --accent-dark: #E8608A;
    --glass: rgba(255, 255, 255, 0.65);
    --glass-border: rgba(255, 255, 255, 0.3);
    --shadow-soft: 0 8px 32px rgba(180, 120, 140, 0.15);
    --shadow-glow: 0 0 60px rgba(255, 143, 171, 0.3);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Noto Sans SC', 'ZCOOL XiaoWei', sans-serif;
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ====== 背景画布 ====== */
  canvas#bg-canvas {
    position: fixed; inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  /* ====== 动态背景光斑 ====== */
  .bg-orbs {
    position: fixed; inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.4;
    animation: orbFloat 20s ease-in-out infinite;
  }
  .orb:nth-child(1) {
    width: 400px; height: 400px;
    background: linear-gradient(135deg, #FFB3C6, #FFD0E0);
    top: -10%; left: -10%;
    animation-delay: 0s;
  }
  .orb:nth-child(2) {
    width: 350px; height: 350px;
    background: linear-gradient(135deg, #C8A0E0, #E0B8F0);
    top: 60%; right: -10%;
    animation-delay: -7s;
  }
  .orb:nth-child(3) {
    width: 300px; height: 300px;
    background: linear-gradient(135deg, #FFD088, #FFE0B0);
    bottom: -10%; left: 30%;
    animation-delay: -14s;
  }
  @keyframes orbFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(50px, -30px) scale(1.1); }
    50% { transform: translate(-20px, 40px) scale(0.95); }
    75% { transform: translate(30px, 20px) scale(1.05); }
  }

  /* ====== 主容器 ====== */
  .main {
    position: fixed; inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 8vh;
    gap: 3vh;
    pointer-events: none;
  }

  /* ====== 认证卡片 ====== */
  .cert-card-wrapper {
    position: relative;
    padding: 3px;
    border-radius: 38px;
    background: linear-gradient(135deg, #FF8FAB, #FFB3C6, #FFD088, #C8A0E0, #78C0A0, #FF8FAB);
    background-size: 300% 300%;
    animation: borderGlow 4s ease infinite;
    max-width: 486px;
    width: 91%;
    box-shadow: var(--shadow-soft);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
    pointer-events: auto;
  }
  .cert-card-wrapper:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 20px 60px rgba(180, 120, 140, 0.25), 0 0 80px rgba(255, 143, 171, 0.2);
  }
  .cert-card {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 36px;
    padding: 48px 56px;
    width: 100%;
    position: relative;
    animation: cardAppear 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    user-select: text;
    -webkit-user-select: text;
  }
  @keyframes borderGlow {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  /* 卡片悬浮时，头像也轻微上浮 */
  .cert-card-wrapper:hover .avatar-zone {
    transform: translateY(-6px);
  }
  /* 但如果头像本身被 hover，头像自己要浮更高 */
  .cert-card-wrapper:hover .avatar-zone:hover {
    transform: translateY(-12px) scale(1.05);
  }
  @keyframes cardAppear {
    from { transform: translateY(40px) scale(0.9); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }

  /* ====== 头像区 ====== */
  .avatar-zone {
    position: relative;
    width: 180px; height: 180px;
    margin: 0 auto 28px;
    cursor: pointer;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.4s ease;
    z-index: 2;
  }
  .avatar-zone:hover {
    transform: translateY(-12px) scale(1.05);
    filter: drop-shadow(0 16px 32px rgba(255, 143, 171, 0.35));
  }
  .avatar-zone:active { transform: scale(.95); }
  .avatar-zone.bounce {
    animation: avatarBounce .8s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes avatarBounce {
    0%   { transform: scale(.92) translateY(0); }
    30%  { transform: scale(1.06) translateY(-16px); }
    50%  { transform: scale(1.02) translateY(-10px); }
    70%  { transform: scale(1.04) translateY(-6px); }
    100% { transform: scale(1) translateY(0); }
  }

  .avatar-ring {
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #FF8FAB, #FFD088, #C8A0E0, #78C0A0, #FF8FAB);
    animation: ringRotate 4s linear infinite;
    z-index: 1;
  }
  @keyframes ringRotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .avatar-img {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 50%;
    object-fit: cover;
    z-index: 2;
    border: 5px solid white;
    box-shadow: var(--shadow-glow);
    transition: box-shadow .5s ease;
  }

  /* ====== 称号区 ====== */
  .title-section {
    text-align: center;
    margin-bottom: 20px;
  }
  .title-prefix {
    font-family: 'Noto Sans SC', sans-serif;
    font-weight: 500;
    font-size: 18px;
    color: #8a7a80;
    letter-spacing: .08em;
    margin-bottom: 8px;
  }
  .title-word {
    font-family: 'ZCOOL XiaoWei', serif;
    font-weight: 400;
    font-size: 56px;
    letter-spacing: .06em;
    display: inline-block;
    padding: 10px 28px;
    border-radius: 20px;
    transition: color .45s ease, background .45s ease, transform .45s cubic-bezier(.34,1.56,.64,1);
    user-select: text;
    -webkit-user-select: text;
  }
  .title-word.pop {
    animation: wordPop .55s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes wordPop {
    0%   { transform: scale(.5) rotateX(40deg); opacity: .3; }
    50%  { transform: scale(1.15) rotateX(0deg); opacity: 1; }
    100% { transform: scale(1) rotateX(0deg); opacity: 1; }
  }

  /* ====== 提示文字 ====== */
  .hint-text {
    font-family: 'Nunito', 'Noto Sans SC', sans-serif;
    font-size: 14px;
    letter-spacing: .14em;
    color: #b0a0a8;
    text-align: center;
    margin-bottom: 24px;
    animation: hintFade 3s ease-in-out infinite;
    user-select: text;
    -webkit-user-select: text;
  }
  @keyframes hintFade {
    0%, 100% { opacity: .6; }
    50%      { opacity: 1; }
  }

  /* ====== 标签组 ====== */
  .tag-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .tag {
    font-family: 'Nunito', 'Noto Sans SC', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .1em;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(255,255,255,.7);
    backdrop-filter: blur(10px);
    border: 1.5px solid rgba(200,180,190,.2);
    cursor: default;
    transition: all .35s cubic-bezier(.34,1.56,.64,1);
    color: #6B5A60;
    user-select: text;
    -webkit-user-select: text;
  }
  .tag:hover {
    transform: scale(1.1) translateY(-6px);
    background: rgba(255,143,171,.12);
    border-color: rgba(255,143,171,.4);
    color: #C86B85;
    box-shadow: 0 12px 28px rgba(255,143,171,.25);
  }

  /* ====== 顶部按钮组 ====== */
  .top-btns {
    position: fixed;
    top: 20px; right: 20px;
    z-index: 100;
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .icon-btn {
    width: 48px; height: 48px;
    border-radius: 16px;
    border: 1.5px solid var(--glass-border);
    background: var(--glass);
    backdrop-filter: blur(20px);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .3s ease;
    font-size: 20px;
    box-shadow: var(--shadow-soft);
  }
  .icon-btn:hover {
    border-color: rgba(255,143,171,.4);
    background: rgba(255,255,255,.9);
    transform: translateY(-6px) scale(1.05);
    box-shadow: 0 16px 40px rgba(255,143,171,.25);
  }
  .icon-btn:active { transform: translateY(0); }

  /* ====== 弹窗通用 ====== */
  .overlay {
    position: fixed; inset: 0;
    z-index: 200;
    background: rgba(0,0,0,.4);
    backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .35s ease;
  }
  .overlay.show {
    opacity: 1;
    pointer-events: all;
  }

  .panel {
    background: rgba(255,255,255,.98);
    border-radius: 28px;
    padding: 36px 32px 28px;
    width: 420px;
    max-width: 92vw;
    box-shadow:
      0 2px 0 rgba(255,255,255,.8) inset,
      0 32px 80px rgba(180,120,140,.2),
      0 12px 32px rgba(0,0,0,.1);
    transform: translateY(32px) scale(.95);
    transition: transform .38s cubic-bezier(.34,1.56,.64,1);
    border: 1.5px solid rgba(255,220,230,.6);
    max-height: 90vh;
    overflow-y: auto;
  }
  .overlay.show .panel {
    transform: translateY(0) scale(1);
  }

  .panel-title {
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #3a2a30;
    margin-bottom: 24px;
    text-align: center;
  }

  .form-group { margin-bottom: 20px; }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #9a8890;
    margin-bottom: 10px;
    letter-spacing: .06em;
    text-transform: uppercase;
  }

  .form-group input[type="text"] {
    width: 100%;
    padding: 14px 18px;
    border: 2px solid rgba(200,180,190,.2);
    border-radius: 16px;
    font-size: 16px;
    font-family: 'Noto Sans SC', sans-serif;
    outline: none;
    transition: all .3s ease;
    background: rgba(255,248,244,.6);
    color: #3a2a30;
  }
  .form-group input[type="text"]:focus {
    border-color: rgba(255,143,171,.5);
    box-shadow: 0 0 0 4px rgba(255,143,171,.1);
    background: #fff;
  }

  .avatar-upload-area {
    width: 100%;
    height: 140px;
    border: 2.5px dashed rgba(200,180,190,.35);
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all .3s ease;
    background: rgba(255,248,244,.6);
    position: relative;
    overflow: hidden;
  }
  .avatar-upload-area:hover {
    border-color: rgba(255,143,171,.5);
    background: rgba(255,143,171,.03);
    transform: scale(1.01);
  }
  .avatar-upload-area.has-image {
    border-style: solid;
    border-color: rgba(255,143,171,.3);
  }
  .avatar-upload-area input[type="file"] { display: none; }
  .avatar-upload-area .upload-icon { font-size: 36px; margin-bottom: 8px; }
  .avatar-upload-area .upload-text { font-size: 14px; color: #b0a0a8; }
  .avatar-upload-area .preview-img {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 16px;
  }

  .btn-row {
    display: flex;
    gap: 12px;
    margin-top: 24px;
  }
  .btn-confirm, .btn-cancel {
    flex: 1;
    padding: 14px 0;
    border-radius: 16px;
    border: none;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all .25s ease;
    font-family: 'Noto Sans SC', sans-serif;
    letter-spacing: .03em;
  }
  .btn-confirm {
    background: linear-gradient(135deg, #FF8FAB 0%, #FFB3C6 100%);
    color: #fff;
    box-shadow: 0 6px 24px rgba(255,143,171,.35);
  }
  .btn-confirm:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 32px rgba(255,143,171,.45);
  }
  .btn-cancel {
    background: rgba(240,235,232,.8);
    color: #8a7a80;
  }
  .btn-cancel:hover { background: #e8e0dc; }

  .panel-footer {
    text-align: center;
    margin-top: 16px;
    font-size: 13px;
    color: #c8b8c0;
    letter-spacing: .04em;
  }

  /* ====== 截图面板专属样式 ====== */
  .screenshot-preview {
    width: 100%;
    max-height: 280px;
    overflow: hidden;
    border-radius: 20px;
    margin-bottom: 24px;
    border: 2px solid rgba(255,143,171,.15);
    box-shadow: 0 12px 32px rgba(0,0,0,.12);
  }
  .screenshot-img {
    width: 100%;
    height: auto;
    display: block;
  }

  .welcome-section {
    text-align: center;
    padding: 20px;
    background: linear-gradient(135deg, rgba(255,143,171,.06), rgba(255,200,210,.04));
    border-radius: 18px;
    border: 1.5px solid rgba(255,143,171,.12);
    margin-bottom: 20px;
  }
  .welcome-text {
    font-size: 18px;
    font-weight: 700;
    color: #3a2a30;
    margin-bottom: 12px;
  }
  .welcome-link {
    display: inline-block;
    font-size: 14px;
    color: var(--accent-dark);
    text-decoration: none;
    padding: 10px 20px;
    background: rgba(255,255,255,.9);
    border-radius: 12px;
    border: 1.5px solid rgba(255,143,171,.25);
    transition: all .3s ease;
    font-weight: 600;
    letter-spacing: .02em;
  }
  .welcome-link:hover {
    background: rgba(255,143,171,.08);
    border-color: rgba(255,143,171,.4);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255,143,171,.2);
  }
  .welcome-hint {
    font-size: 13px;
    color: #b0a0a8;
    margin-top: 12px;
    letter-spacing: .04em;
  }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(200,180,190,.25), transparent);
    margin: 20px 0;
  }

  /* ====== 装饰粒子 ====== */
  .deco-particles {
    position: fixed; inset: 0;
    z-index: 8;
    pointer-events: none;
    overflow: hidden;
  }
  .deco-particle {
    position: absolute;
    left: var(--x);
    top: var(--y);
    width: var(--size);
    height: var(--size);
    border-radius: 50%;
    background: var(--color);
    opacity: 0;
    animation: decoFloat var(--duration) ease-in-out var(--delay) infinite;
    box-shadow: 0 0 12px var(--color);
  }
  @keyframes decoFloat {
    0% {
      opacity: 0;
      transform: translate(0, 0) scale(0.5);
    }
    15% {
      opacity: 0.7;
      transform: translate(10px, -15px) scale(1);
    }
    50% {
      opacity: 0.5;
      transform: translate(-8px, -30px) scale(0.8);
    }
    85% {
      opacity: 0.6;
      transform: translate(12px, -10px) scale(1.1);
    }
    100% {
      opacity: 0;
      transform: translate(0, 0) scale(0.5);
    }
  }

  /* ====== 底部欢迎区 ====== */
  .footer-section {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    padding: 3px;
    border-radius: 22px;
    background: linear-gradient(135deg, #FFB3C6, #FFD088, #C8A0E0, #FFB3C6);
    background-size: 200% 200%;
    animation: borderGlow 5s ease infinite, footerAppear 1s ease 0.5s both;
    box-shadow: 0 8px 32px rgba(180, 120, 140, 0.12);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
  }
  .footer-inner {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 16px 28px;
    border-radius: 20px;
    text-align: center;
    user-select: text;
    -webkit-user-select: text;
  }
  @keyframes footerAppear {
    from { opacity: 0; transform: translateX(-50%) translateY(20px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  .footer-section:hover {
    transform: translateX(-50%) translateY(-8px) scale(1.03);
    box-shadow: 0 16px 48px rgba(180, 120, 140, 0.2);
  }
  .footer-welcome {
    font-size: 14px;
    font-weight: 600;
    color: #4a3a40;
    margin-bottom: 8px;
    letter-spacing: .04em;
    user-select: text;
    -webkit-user-select: text;
  }
  .footer-link {
    font-size: 13px;
    color: var(--accent-dark);
    text-decoration: none;
    font-weight: 600;
    letter-spacing: .02em;
    transition: all .3s ease;
    padding: 6px 14px;
    background: rgba(255, 143, 171, 0.08);
    border-radius: 10px;
    display: inline-block;
    user-select: text;
    -webkit-user-select: text;
  }
  .footer-link:hover {
    background: rgba(255, 143, 171, 0.15);
    color: #d44d7a;
  }
  .footer-credit {
    font-size: 11px;
    color: #b0a0a8;
    margin-top: 10px;
    letter-spacing: .06em;
    user-select: text;
    -webkit-user-select: text;
  }

  /* ====== 响应式 ====== */
  @media (max-width: 768px) {
    .main { padding-top: 5vh; }
    .cert-card-wrapper { max-width: 95%; }
    .cert-card { padding: 36px 28px; }
    .avatar-zone { width: 140px; height: 140px; }
    .title-prefix { font-size: 17px; }
    .title-word { font-size: 42px; }
    .tag { font-size: 12px; padding: 8px 14px; }
    .hint-text { font-size: 13px; }
    .top-btns { top: 12px; right: 12px; }
    .icon-btn { width: 42px; height: 42px; font-size: 18px; border-radius: 14px; }
    .panel { padding: 28px 20px 22px; }
    .orb { filter: blur(60px); }
    .footer-section {
      bottom: 16px;
    }
    .footer-inner {
      padding: 14px 20px;
    }
    .footer-welcome { font-size: 13px; }
    .footer-link { font-size: 12px; }
    .footer-credit { font-size: 10px; }
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<!-- 动态背景光斑 -->
<div class="bg-orbs">
  <div class="orb"></div>
  <div class="orb"></div>
  <div class="orb"></div>
</div>

<!-- 顶部按钮组 -->
<div class="top-btns">
  <button class="icon-btn download-btn" id="downloadBtn" title="下载截图">📸</button>
  <button class="icon-btn settings-btn" id="settingsBtn" title="自定义设置">⚙️</button>
</div>

<!-- 设置面板 -->
<div class="overlay" id="settingsOverlay">
  <div class="panel">
    <p class="panel-title">✨ 自定义猪猪认证</p>
    <div class="form-group">
      <label>🏷️ 名字</label>
      <input type="text" id="nameInput" placeholder="输入Ta的名字..." maxlength="20">
    </div>
    <div class="form-group">
      <label>🖼️ 头像</label>
      <div class="avatar-upload-area" id="uploadArea">
        <span class="upload-icon">📤</span>
        <span class="upload-text">点击或拖拽上传头像</span>
        <input type="file" id="avatarFileInput" accept="image/*">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-cancel" id="btnCancel">取消</button>
      <button class="btn-confirm" id="btnConfirm">生成认证 ✅</button>
    </div>
    <p class="panel-footer">点击右上角 ⚙️ 随时修改</p>
  </div>
</div>

<!-- 截图展示面板 -->
<div class="overlay" id="screenshotOverlay">
  <div class="panel">
    <p class="panel-title">📸 截图已生成</p>

    <div class="screenshot-preview" id="screenshotPreview">
      <img class="screenshot-img" id="screenshotImg" src="" alt="截图预览">
    </div>

    <div class="welcome-section">
      <p class="welcome-text">🐷 快来和朋友一起玩吧~</p>
      <a class="welcome-link" href="https://www.namelessying.xin/smallpig/" target="_blank">
        🔗 namelessying.xin/smallpig
      </a>

<script>
// ============================================================
// 默认头像
// ============================================================
const DEFAULT_AVATAR = 'data:image/svg+xml,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">' +
  '<defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">' +
  '<stop offset="0%" style="stop-color:#FFB3C6"/>' +
  '<stop offset="100%" style="stop-color:#FFD0E0"/>' +
  '</linearGradient></defs>' +
  '<rect width="200" height="200" rx="100" fill="url(#g)"/>' +
  '<circle cx="100" cy="80" r="30" fill="#fff" opacity=".6"/>' +
  '<ellipse cx="100" cy="155" rx="45" ry="38" fill="#fff" opacity=".6"/>' +
  '</svg>'
);

// ============================================================
// 称号池 & 配色
// ============================================================
const TITLES = ['猪猪', '笨蛋', '呆瓜', '猪咪', '憨憨', '懒虫', '撒娇怪', '小吃货', '小可爱', '萌萌哒'];
const COLORS = {
  '猪猪':   { fg: '#FF8FAB', bg: 'rgba(255,143,171,.10)' },
  '笨蛋':   { fg: '#FF9078', bg: 'rgba(255,144,120,.10)' },
  '呆瓜':   { fg: '#78C0A0', bg: 'rgba(120,192,160,.10)' },
  '猪咪':   { fg: '#E878A0', bg: 'rgba(232,120,160,.10)' },
  '憨憨':   { fg: '#F0A860', bg: 'rgba(240,168,96,.10)' },
  '懒虫':   { fg: '#A898D0', bg: 'rgba(168,152,208,.10)' },
  '撒娇怪': { fg: '#E88098', bg: 'rgba(232,128,152,.10)' },
  '小吃货': { fg: '#F09860', bg: 'rgba(240,152,96,.10)' },
  '小可爱': { fg: '#FF7EB3', bg: 'rgba(255,126,179,.10)' },
  '萌萌哒': { fg: '#FF85A2', bg: 'rgba(255,133,162,.10)' },
};

const titleWord = document.getElementById('titleWord');
const titlePrefix = document.getElementById('titlePrefix');
const avatarZone = document.getElementById('avatarZone');
const avatarImg = document.getElementById('avatarImg');
const hintText = document.getElementById('hintText');
let currentTitle = '猪猪';
let clickCount = 0;
let userName = '';

function setTitle(title) {
  if (title === currentTitle) return;
  currentTitle = title;
  const c = COLORS[title];
  titleWord.textContent = title;
  titleWord.style.color = c.fg;
  titleWord.style.background = c.bg;
  titleWord.classList.remove('pop');
  void titleWord.offsetWidth;
  titleWord.classList.add('pop');
  document.documentElement.style.setProperty('--accent', c.fg);
}

function randomTitle(exclude) {
  const pool = TITLES.filter(t => t !== exclude);
  return pool[Math.floor(Math.random() * pool.length)];
}

function updatePrefix() {
  const name = userName || 'Ta';
  titlePrefix.textContent = name + ' 是';
  hintText.textContent = '👆 戳戳' + name + '的头像，解锁更多称号';
  document.title = name + 'の猪猪认证';
}

// ============================================================
// 设置面板
// ============================================================
const settingsBtn = document.getElementById('settingsBtn');
const settingsOverlay = document.getElementById('settingsOverlay');
const nameInput = document.getElementById('nameInput');
const uploadArea = document.getElementById('uploadArea');
const avatarFileInput = document.getElementById('avatarFileInput');
const btnConfirm = document.getElementById('btnConfirm');
const btnCancel = document.getElementById('btnCancel');
let pendingAvatarSrc = null;
let currentAvatarSrc = '';
let currentShareCode = '';

settingsBtn.addEventListener('click', () => {
  nameInput.value = userName;
  pendingAvatarSrc = null;
  uploadArea.classList.remove('has-image');
  uploadArea.innerHTML = '<span class="upload-icon">📤</span><span class="upload-text">点击或拖拽上传头像</span>';
  const fi = document.createElement('input');
  fi.type = 'file'; fi.id = 'avatarFileInput'; fi.accept = 'image/*'; fi.style.display = 'none';
  uploadArea.appendChild(fi);
  fi.addEventListener('change', (e) => { if (e.target.files[0]) handleFile(e.target.files[0]); });
  uploadArea.onclick = () => fi.click();
  settingsOverlay.classList.add('show');
  setTimeout(() => nameInput.focus(), 350);
});

btnCancel.addEventListener('click', () => settingsOverlay.classList.remove('show'));
settingsOverlay.addEventListener('click', (e) => { if (e.target === settingsOverlay) settingsOverlay.classList.remove('show'); });

uploadArea.addEventListener('dragover', (e) => {
  e.preventDefault();
  uploadArea.style.borderColor = 'rgba(255,143,171,.7)';
});
uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor = ''; });
uploadArea.addEventListener('drop', (e) => {
  e.preventDefault();
  uploadArea.style.borderColor = '';
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) handleFile(file);
});

function handleFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    pendingAvatarSrc = e.target.result;
    uploadArea.classList.add('has-image');
    uploadArea.innerHTML = '<img class="preview-img" src="' + pendingAvatarSrc + '" alt="预览">';
  };
  reader.readAsDataURL(file);
}

function compressImage(src, callback) {
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    let w = img.width, h = img.height, max = 56;
    if (w > h) { if (w > max) { h = Math.round(h * max / w); w = max; } }
    else       { if (h > max) { w = Math.round(w * max / h); h = max; } }
    canvas.width = w; canvas.height = h;
    const c = canvas.getContext('2d');
    c.drawImage(img, 0, 0, w, h);
    const full = canvas.toDataURL('image/jpeg', 0.35);
    const b64 = full.split(',')[1];
    const safe = b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    callback(full, safe);
  };
  img.src = src;
}

btnConfirm.addEventListener('click', () => {
  userName = nameInput.value.trim();

  const doFinish = (avatarSrc, shareCode) => {
    currentAvatarSrc = avatarSrc;
    if (shareCode) currentShareCode = shareCode;
    avatarImg.src = avatarSrc;
    try { localStorage.setItem('pig_avatar', avatarSrc); } catch(e) {}
    if (currentShareCode) {
      try { localStorage.setItem('pig_share_code', currentShareCode); } catch(e) {}
    }

    if (userName) {
      try { localStorage.setItem('pig_name', userName); } catch(e) {}
    } else {
      try { localStorage.removeItem('pig_name'); } catch(e) {}
    }

    updatePrefix();
    settingsOverlay.classList.remove('show');
    spawnBurst(40);
    sfx.init();
    sfx.resume();
    sfx.burst();
  };

  if (pendingAvatarSrc) {
    compressImage(pendingAvatarSrc, (fullSrc, urlSafe) => {
      doFinish(fullSrc, urlSafe);
    });
  } else {
    doFinish(currentAvatarSrc || DEFAULT_AVATAR, currentShareCode);
  }
});

// ============================================================
// 截图下载面板
// ============================================================
const downloadBtn = document.getElementById('downloadBtn');
const screenshotOverlay = document.getElementById('screenshotOverlay');

const btnSaveScreenshot = document.getElementById('btnSaveScreenshot');
const btnScreenshotClose = document.getElementById('btnScreenshotClose');

let screenshotDataUrl = null;

downloadBtn.addEventListener('click', async () => {
  downloadBtn.style.pointerEvents = 'none';
  downloadBtn.innerHTML = '⏳';

  try {
    const certCard = document.querySelector('.cert-card-wrapper');

btnScreenshotClose.addEventListener('click', () => screenshotOverlay.classList.remove('show'));
screenshotOverlay.addEventListener('click', (e) => { if (e.target === screenshotOverlay) screenshotOverlay.classList.remove('show'); });

btnSaveScreenshot.addEventListener('click', () => {
  if (!screenshotDataUrl) return;
  const link = document.createElement('a');
  link.download = (userName || '猪猪') + 'の猪猪认证.png';
  link.href = screenshotDataUrl;
  link.click();
});

// ============================================================
// Web Audio 8-bit 音效引擎
// ============================================================
class SoundEngine {
  constructor() { this.ctx = null; this.lastTime = 0; this.noteIdx = 0; }
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
  }
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }
  ping() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const gap = Date.now() - this.lastTime;
    this.lastTime = Date.now();
    if (gap < 420) this.noteIdx++; else this.noteIdx = 0;
    const pent = [0, 2, 4, 7, 9];
    const oct = Math.floor(this.noteIdx / 5);
    const semitone = pent[this.noteIdx % 5];
    const freq = 523.25 * Math.pow(2, (semitone + oct * 12) / 12);
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.22, now);
    gain.gain.exponentialRampToValueAtTime(0.005, now + 0.11);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(now); osc.stop(now + 0.14);
  }
  burst() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const len = 0.07, sr = this.ctx.sampleRate;
    const buf = this.ctx.createBuffer(1, sr * len, sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++)
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.5);
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.10, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + len);
    src.connect(gain); gain.connect(this.ctx.destination);
    src.start(now);
  }
}
const sfx = new SoundEngine();

// ============================================================
// Canvas 粒子系统
// ============================================================
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;

const PALETTE = [
  '#FFB3C6','#FFC8A0','#FFE0B8','#E8B8D0','#C8A8E0',
  '#B8C8F0','#A0D8D0','#FFD8A0','#F0A8B8','#D0B8E8',
  '#FFC0D0','#E0C8F0','#C0E0D8','#FFB8D0','#F8C8B0',
];

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  const rect = avatarZone.getBoundingClientRect();
  cx = rect.left + rect.width / 2;
  cy = rect.top + rect.height / 2;
}
window.addEventListener('resize', resize);
resize();

class Particle {
  constructor(type, opts = {}) {
    this.type = type;
    this.x = opts.x || Math.random() * W;
    this.y = opts.y || Math.random() * H;
    this.vx = opts.vx || 0;
    this.vy = opts.vy || 0;
    this.size = opts.size || (1.5 + Math.random() * 3.5);
    this.color = opts.color || PALETTE[Math.floor(Math.random() * PALETTE.length)];
    this.opacity = opts.opacity || (0.25 + Math.random() * 0.4);
    this.life = 1;
    this.decay = opts.decay || (0.0003 + Math.random() * 0.0008);
    this.phase = Math.random() * Math.PI * 2;
  }
  update() {
    if (this.type === 'ambient') {
      this.vx += Math.sin(this.phase + performance.now() * 0.001) * 0.015;
      this.vy += Math.cos(this.phase + performance.now() * 0.0013) * 0.015;
      this.vx *= 0.998; this.vy *= 0.998;
      this.x += this.vx; this.y += this.vy;
      if (this.x < -20) this.x = W + 20;
      if (this.x > W + 20) this.x = -20;
      if (this.y < -20) this.y = H + 20;
      if (this.y > H + 20) this.y = -20;
      this.opacity = 0.18 + Math.sin(this.phase + performance.now() * 0.002) * 0.1;
    } else if (this.type === 'burst') {
      this.x += this.vx; this.y += this.vy;
      this.vx *= 0.96; this.vy *= 0.96;
      this.life -= this.decay;
      this.size *= 0.995;
    }
  }
  draw(ctx) {
    const alpha = this.type === 'burst'
      ? Math.max(0, this.life * this.opacity)
      : Math.max(0.08, this.opacity);
    ctx.beginPath();
    ctx.arc(this.x, this.y, Math.max(0.3, this.size), 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.globalAlpha = alpha;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  alive() { return this.type === 'ambient' || this.life > 0.02; }
}

let particles = [];
const AMBIENT_COUNT = 150;
for (let i = 0; i < AMBIENT_COUNT; i++) particles.push(new Particle('ambient'));

function spawnBurst(count = 28) {
  resize();
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2.5 + Math.random() * 8;
    particles.push(new Particle('burst', {
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 2 + Math.random() * 6,
      color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
      opacity: 0.6 + Math.random() * 0.4,
      decay: 0.012 + Math.random() * 0.025,
    }));
  }
}

function render() {
  ctx.clearRect(0, 0, W, H);
  const t = performance.now() * 0.0003;
  const g1 = ctx.createRadialGradient(
    W * 0.5 + Math.sin(t) * W * 0.08, H * 0.45 + Math.cos(t * 1.3) * H * 0.06, W * 0.06,
    W * 0.5, H * 0.5, W * 1.2
  );
  g1.addColorStop(0, 'rgba(255,180,200,0.12)');
  g1.addColorStop(0.25, 'rgba(255,220,180,0.06)');
  g1.addColorStop(0.5, 'rgba(210,180,230,0.04)');
  g1.addColorStop(0.75, 'rgba(180,200,235,0.02)');
  g1.addColorStop(1, 'rgba(255,245,235,0)');
  ctx.fillStyle = g1; ctx.fillRect(0, 0, W, H);

  particles = particles.filter(p => { p.update(); return p.alive(); });
  const ac = particles.filter(p => p.type === 'ambient').length;
  if (ac < AMBIENT_COUNT - 10) {
    for (let i = 0; i < AMBIENT_COUNT - ac; i++) particles.push(new Particle('ambient'));
  }
  for (const p of particles) p.draw(ctx);
  requestAnimationFrame(render);
}
render();

// ============================================================
// 交互
// ============================================================
avatarZone.addEventListener('click', (e) => {
  e.preventDefault();
  sfx.init();
  sfx.resume();

  const newTitle = randomTitle(currentTitle);
  setTitle(newTitle);
  clickCount++;

  sfx.ping();
  if (clickCount > 0 && clickCount % 5 === 0) sfx.burst();

  spawnBurst(26 + Math.floor(Math.random() * 12));

  avatarZone.classList.remove('bounce');
  void avatarZone.offsetWidth;
  avatarZone.classList.add('bounce');

  if (clickCount >= 3) hintText.style.opacity = '0';
});

avatarZone.addEventListener('touchstart', (e) => {
  e.preventDefault();
  avatarZone.click();
}, { passive: false });

// ============================================================
// 初始化
// ============================================================
function init() {
  let urlName = '', urlAvatarCode = '';
  const hash = window.location.hash.slice(1);
  if (hash) {
    const hp = new URLSearchParams(hash);
    urlName = hp.get('n') || '';
    urlAvatarCode = hp.get('a') || '';
  }
  if (!urlName) {
    const qp = new URLSearchParams(window.location.search);
    urlName = qp.get('name') || '';
  }

  const savedName = localStorage.getItem('pig_name') || '';
  const savedAvatar = localStorage.getItem('pig_avatar') || '';
  const savedShareCode = localStorage.getItem('pig_share_code') || '';

  userName = urlName || savedName;

  if (urlAvatarCode) {
    let b64 = urlAvatarCode.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    currentAvatarSrc = 'data:image/jpeg;base64,' + b64;
    currentShareCode = urlAvatarCode;
  } else {
    currentAvatarSrc = savedAvatar || DEFAULT_AVATAR;
    currentShareCode = savedShareCode;
  }

  avatarImg.src = currentAvatarSrc;
  updatePrefix();

  if (!userName && !savedAvatar && !urlName && !urlAvatarCode) {
    setTimeout(() => {
      settingsOverlay.classList.add('show');
      const fi = document.createElement('input');
      fi.type = 'file'; fi.id = 'avatarFileInput'; fi.accept = 'image/*'; fi.style.display = 'none';
      uploadArea.appendChild(fi);
      fi.addEventListener('change', (e) => { if (e.target.files[0]) handleFile(e.target.files[0]); });
      uploadArea.onclick = () => fi.click();
      setTimeout(() => nameInput.focus(), 350);
    }, 600);
  }
}

init();
</script>
