<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猪猪认证</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@300;400;500;700;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF6F0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Noto Sans SC', 'ZCOOL XiaoWei', sans-serif;
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ====== 背景 Canvas ====== */
  canvas#bg-canvas {
    position: fixed; inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  /* ====== 主容器 ====== */
  .main {
    position: fixed; inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3.5vh;
    transition: opacity .4s ease;
  }

  /* ====== 头像区 ====== */
  .avatar-zone {
    position: relative;
    width: 26vw; height: 26vw;
    min-width: 180px; min-height: 180px;
    cursor: pointer;
    transition: transform .15s ease;
  }
  .avatar-zone:active {
    transform: scale(.92);
  }
  .avatar-zone.bounce {
    animation: avatarBounce .6s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes avatarBounce {
    0%   { transform: scale(.88); }
    40%  { transform: scale(1.10); }
    70%  { transform: scale(1.04); }
    100% { transform: scale(1); }
  }

  .avatar-ring {
    position: absolute;
    inset: -12%;
    border-radius: 50%;
    pointer-events: none;
  }

  .avatar-img {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    border-radius: 50%;
    object-fit: cover;
    z-index: 2;
    box-shadow:
      0 0 60px rgba(255,143,171,.35),
      0 0 0 8px rgba(255,255,255,.5),
      0 8px 32px rgba(0,0,0,.12);
    transition: box-shadow .5s ease;
  }

  /* 光环 SVG 旋转 */
  .orbit-ring {
    position: absolute;
    inset: -8%;
    z-index: 1;
    pointer-events: none;
    animation: orbitSpin 8s linear infinite;
  }
  .orbit-ring:nth-child(2) {
    inset: -16%;
    animation-duration: 13s;
    animation-direction: reverse;
    opacity: .6;
  }
  .orbit-ring:nth-child(3) {
    inset: -22%;
    animation-duration: 18s;
    opacity: .35;
  }
  @keyframes orbitSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .orbit-dot {
    position: absolute;
    width: 10px; height: 10px;
    border-radius: 50%;
    top: 0; left: 50%;
    transform: translateX(-50%);
    animation: dotPulse 2.5s ease-in-out infinite;
  }
  @keyframes dotPulse {
    0%, 100% { opacity: .7; transform: translateX(-50%) scale(1); }
    50%      { opacity: 1;   transform: translateX(-50%) scale(1.5); }
  }

  /* ====== 称号区 ====== */
  .title-block {
    display: flex;
    align-items: baseline;
    gap: 1.2vw;
    flex-wrap: wrap;
    justify-content: center;
  }
  .title-prefix {
    font-family: 'Noto Sans SC', sans-serif;
    font-weight: 500;
    font-size: 2.2vw;
    opacity: .75;
    letter-spacing: .08em;
  }
  .title-flip {
    perspective: 600px;
    display: inline-block;
  }
  .title-word {
    font-family: 'ZCOOL XiaoWei', serif;
    font-weight: 400;
    font-size: 5.5vw;
    letter-spacing: .06em;
    display: inline-block;
    padding: .4vh 1.8vw;
    border-radius: 18px;
    transition: color .45s ease, background .45s ease, transform .45s cubic-bezier(.34,1.56,.64,1);
  }
  .title-word.pop {
    animation: wordPop .55s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes wordPop {
    0%   { transform: scale(.5) rotateX(40deg); opacity: .3; }
    50%  { transform: scale(1.15) rotateX(0deg); opacity: 1; }
    100% { transform: scale(1) rotateX(0deg); opacity: 1; }
  }

  /* ====== 提示文字 ====== */
  .hint-text {
    font-family: 'Nunito', 'Noto Sans SC', sans-serif;
    font-size: 1vw;
    letter-spacing: .14em;
    opacity: .4;
    text-align: center;
    transition: opacity .8s ease;
    animation: hintFade 3s ease-in-out infinite;
  }
  @keyframes hintFade {
    0%, 100% { opacity: .3; }
    50%      { opacity: .55; }
  }

  /* ====== 标签组 ====== */
  .tag-row {
    display: flex;
    gap: 1.4vw;
    flex-wrap: wrap;
    justify-content: center;
  }
  .tag {
    font-family: 'Nunito', 'Noto Sans SC', sans-serif;
    font-weight: 700;
    font-size: .95vw;
    letter-spacing: .1em;
    padding: 1vh 1.8vw;
    border-radius: 999px;
    background: rgba(255,255,255,.55);
    backdrop-filter: blur(6px);
    border: 1.5px solid rgba(200,180,190,.25);
    cursor: default;
    transition: all .35s cubic-bezier(.34,1.56,.64,1);
    color: #6B5A60;
  }
  .tag:hover {
    transform: scale(1.12);
    background: rgba(255,143,171,.15);
    border-color: rgba(255,143,171,.45);
    color: #C86B85;
    box-shadow: 0 4px 18px rgba(255,143,171,.2);
  }

  /* ====== 设置按钮 ====== */
  .settings-btn {
    position: fixed;
    top: 20px; right: 20px;
    z-index: 100;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 2px solid rgba(200,180,190,.3);
    background: rgba(255,255,255,.7);
    backdrop-filter: blur(8px);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .3s ease;
    font-size: 20px;
  }
  .settings-btn:hover {
    transform: rotate(60deg) scale(1.1);
    border-color: rgba(255,143,171,.5);
    background: rgba(255,255,255,.9);
    box-shadow: 0 4px 16px rgba(255,143,171,.2);
  }

  /* ====== 设置面板 ====== */
  .settings-overlay {
    position: fixed; inset: 0;
    z-index: 200;
    background: rgba(0,0,0,.35);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .35s ease;
  }
  .settings-overlay.show {
    opacity: 1;
    pointer-events: all;
  }

  .settings-panel {
    background: #fff;
    border-radius: 24px;
    padding: 36px 32px 28px;
    width: 380px;
    max-width: 92vw;
    box-shadow: 0 20px 60px rgba(0,0,0,.15);
    transform: translateY(30px) scale(.95);
    transition: transform .35s cubic-bezier(.34,1.56,.64,1);
  }
  .settings-overlay.show .settings-panel {
    transform: translateY(0) scale(1);
  }

  .settings-panel h2 {
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: #4a3a40;
    margin-bottom: 24px;
    text-align: center;
  }

  .form-group {
    margin-bottom: 20px;
  }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: #8a7a80;
    margin-bottom: 8px;
    letter-spacing: .05em;
  }

  .form-group input[type="text"] {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid rgba(200,180,190,.3);
    border-radius: 14px;
    font-size: 15px;
    font-family: 'Noto Sans SC', sans-serif;
    outline: none;
    transition: border-color .3s ease, box-shadow .3s ease;
    background: #faf8f5;
  }
  .form-group input[type="text"]:focus {
    border-color: rgba(255,143,171,.6);
    box-shadow: 0 0 0 4px rgba(255,143,171,.1);
  }

  .avatar-upload-area {
    width: 100%;
    height: 140px;
    border: 2.5px dashed rgba(200,180,190,.4);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all .3s ease;
    background: #faf8f5;
    position: relative;
    overflow: hidden;
  }
  .avatar-upload-area:hover {
    border-color: rgba(255,143,171,.5);
    background: rgba(255,143,171,.04);
  }
  .avatar-upload-area.has-image {
    border-style: solid;
    border-color: rgba(255,143,171,.3);
  }
  .avatar-upload-area input[type="file"] {
    display: none;
  }
  .avatar-upload-area .upload-icon {
    font-size: 32px;
    margin-bottom: 6px;
  }
  .avatar-upload-area .upload-text {
    font-size: 13px;
    color: #aaa0a5;
  }
  .avatar-upload-area .preview-img {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 14px;
  }

  .btn-row {
    display: flex;
    gap: 12px;
    margin-top: 24px;
  }
  .btn-confirm, .btn-cancel {
    flex: 1;
    padding: 12px 0;
    border-radius: 14px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all .25s ease;
    font-family: 'Noto Sans SC', sans-serif;
  }
  .btn-confirm {
    background: linear-gradient(135deg, #FF8FAB, #FFB3C6);
    color: #fff;
    box-shadow: 0 4px 16px rgba(255,143,171,.3);
  }
  .btn-confirm:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(255,143,171,.4);
  }
  .btn-cancel {
    background: #f0ebe8;
    color: #8a7a80;
  }
  .btn-cancel:hover {
    background: #e8e0dc;
  }

  .settings-footer {
    text-align: center;
    margin-top: 16px;
    font-size: 12px;
    color: #c0b0b5;
    letter-spacing: .05em;
  }

  /* ====== 响应式 ====== */
  @media (max-width: 768px) {
    .avatar-zone { width: 50vw; height: 50vw; min-width: 140px; min-height: 140px; }
    .title-prefix { font-size: 4.5vw; }
    .title-word { font-size: 10vw; }
    .tag { font-size: 2.4vw; padding: 1.2vh 3vw; }
    .hint-text { font-size: 2.4vw; }
    .orbit-ring:nth-child(2) { inset: -20%; }
    .orbit-ring:nth-child(3) { inset: -28%; }
    .settings-btn { top: 12px; right: 12px; width: 38px; height: 38px; font-size: 17px; }
    .settings-panel { padding: 28px 20px 20px; }
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<!-- 设置按钮 -->
<button class="settings-btn" id="settingsBtn" title="自定义设置">⚙️</button>

<!-- 设置面板 -->
<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-panel">
    <h2>✨ 自定义猪猪认证</h2>
    <div class="form-group">
      <label>🏷️ 名字</label>
      <input type="text" id="nameInput" placeholder="输入Ta的名字..." maxlength="20">
    </div>
    <div class="form-group">
      <label>🖼️ 头像</label>
      <div class="avatar-upload-area" id="uploadArea">
        <span class="upload-icon">📤</span>
        <span class="upload-text">点击或拖拽上传头像</span>
        <input type="file" id="avatarFileInput" accept="image/*">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-cancel" id="btnCancel">取消</button>
      <button class="btn-confirm" id="btnConfirm">生成认证 ✅</button>
    </div>
    <p class="settings-footer">点击右上角 ⚙️ 随时修改</p>
  </div>
</div>

<div class="main" id="mainContent">
  <!-- 头像区 -->
  <div class="avatar-zone" id="avatarZone" title="戳我！">
    <img class="avatar-img" src="" alt="头像" id="avatarImg" draggable="false">
    <div class="orbit-ring">
      <span class="orbit-dot" style="background:#FFB3C6;animation-delay:0s"></span>
      <span class="orbit-dot" style="background:#FFD088;animation-delay:.5s;left:16%;top:16%;transform:rotate(60deg)"></span>
      <span class="orbit-dot" style="background:#C8A0E0;animation-delay:1s;left:84%;top:16%;transform:rotate(120deg)"></span>
      <span class="orbit-dot" style="background:#FFE0B0;animation-delay:1.5s;left:84%;top:84%;transform:rotate(180deg)"></span>
      <span class="orbit-dot" style="background:#FF8FAB;animation-delay:2s;left:16%;top:84%;transform:rotate(240deg)"></span>
    </div>
    <div class="orbit-ring">
      <span class="orbit-dot" style="background:#B8D0F0;animation-delay:.3s"></span>
      <span class="orbit-dot" style="background:#FFC880;animation-delay:.8s;left:24%;top:24%;transform:rotate(72deg)"></span>
      <span class="orbit-dot" style="background:#E0B8D0;animation-delay:1.3s;left:76%;top:24%;transform:rotate(144deg)"></span>
      <span class="orbit-dot" style="background:#FFB8A0;animation-delay:1.8s;left:76%;top:76%;transform:rotate(216deg)"></span>
      <span class="orbit-dot" style="background:#A0D8C8;animation-delay:2.3s;left:24%;top:76%;transform:rotate(288deg)"></span>
    </div>
    <div class="orbit-ring">
      <span class="orbit-dot" style="background:#FFD0E0;animation-delay:.6s"></span>
      <span class="orbit-dot" style="background:#FFA880;animation-delay:1.1s;left:30%;top:30%;transform:rotate(90deg)"></span>
      <span class="orbit-dot" style="background:#D8B8F0;animation-delay:1.6s;left:70%;top:30%;transform:rotate(180deg)"></span>
      <span class="orbit-dot" style="background:#FFD8B0;animation-delay:2.1s;left:70%;top:70%;transform:rotate(270deg)"></span>
    </div>
  </div>

  <!-- 称号 -->
  <div class="title-block">
    <span class="title-prefix" id="titlePrefix">Ta 是</span>
    <span class="title-flip">
      <span class="title-word" id="titleWord" style="color:#FF8FAB;background:rgba(255,143,171,.1)">猪猪</span>
    </span>
  </div>

  <!-- 提示 -->
  <p class="hint-text" id="hintText">👆 戳戳头像，解锁更多称号</p>

  <!-- 标签 -->
  <div class="tag-row">
    <span class="tag">群友公认</span>
    <span class="tag">不可反驳</span>
    <span class="tag">永久有效</span>
  </div>
</div>

<script>
// ============================================================
// 默认头像（圆形灰色占位）
// ============================================================
const DEFAULT_AVATAR = 'data:image/svg+xml,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">' +
  '<rect width="200" height="200" rx="100" fill="#f0e0e8"/>' +
  '<circle cx="100" cy="80" r="35" fill="#d0b8c8"/>' +
  '<ellipse cx="100" cy="160" rx="55" ry="45" fill="#d0b8c8"/>' +
  '</svg>'
);

// ============================================================
// 称号池 & 配色
// ============================================================
const TITLES = ['猪猪', '笨蛋', '呆瓜', '猪咪', '憨憨', '懒虫', '撒娇怪', '小吃货'];
const COLORS = {
  '猪猪':   { fg: '#FF8FAB', bg: 'rgba(255,143,171,.10)' },
  '笨蛋':   { fg: '#FF9078', bg: 'rgba(255,144,120,.10)' },
  '呆瓜':   { fg: '#78C0A0', bg: 'rgba(120,192,160,.10)' },
  '猪咪':   { fg: '#E878A0', bg: 'rgba(232,120,160,.10)' },
  '憨憨':   { fg: '#F0A860', bg: 'rgba(240,168,96,.10)' },
  '懒虫':   { fg: '#A898D0', bg: 'rgba(168,152,208,.10)' },
  '撒娇怪': { fg: '#E88098', bg: 'rgba(232,128,152,.10)' },
  '小吃货': { fg: '#F09860', bg: 'rgba(240,152,96,.10)' },
};

const titleWord = document.getElementById('titleWord');
const titlePrefix = document.getElementById('titlePrefix');
const avatarZone = document.getElementById('avatarZone');
const avatarImg = document.getElementById('avatarImg');
const hintText = document.getElementById('hintText');
const mainContent = document.getElementById('mainContent');
let currentTitle = '猪猪';
let autoTimer = null;
let clickCount = 0;

// 当前用户名
let userName = '';

function setTitle(title) {
  if (title === currentTitle) return;
  currentTitle = title;
  const c = COLORS[title];
  titleWord.textContent = title;
  titleWord.style.color = c.fg;
  titleWord.style.background = c.bg;
  titleWord.classList.remove('pop');
  void titleWord.offsetWidth;
  titleWord.classList.add('pop');
  document.documentElement.style.setProperty('--accent', c.fg);
}

function randomTitle(exclude) {
  const pool = TITLES.filter(t => t !== exclude);
  return pool[Math.floor(Math.random() * pool.length)];
}

function startAuto() {
  clearInterval(autoTimer);
  autoTimer = setInterval(() => {
    setTitle(randomTitle(currentTitle));
  }, 4200);
}

function updatePrefix() {
  const name = userName || 'Ta';
  titlePrefix.textContent = name + ' 是';
  hintText.textContent = '👆 戳戳' + name + '的头像，解锁更多称号';
  document.title = name + 'の猪猪认证';
}

// ============================================================
// 设置面板逻辑
// ============================================================
const settingsBtn = document.getElementById('settingsBtn');
const settingsOverlay = document.getElementById('settingsOverlay');
const nameInput = document.getElementById('nameInput');
const uploadArea = document.getElementById('uploadArea');
const avatarFileInput = document.getElementById('avatarFileInput');
const btnConfirm = document.getElementById('btnConfirm');
const btnCancel = document.getElementById('btnCancel');

let pendingAvatarSrc = null;

settingsBtn.addEventListener('click', () => {
  nameInput.value = userName;
  pendingAvatarSrc = null;
  uploadArea.classList.remove('has-image');
  uploadArea.innerHTML = '<span class="upload-icon">📤</span><span class="upload-text">点击或拖拽上传头像</span>';
  settingsOverlay.classList.add('show');
  setTimeout(() => nameInput.focus(), 350);
});

btnCancel.addEventListener('click', closeSettings);

settingsOverlay.addEventListener('click', (e) => {
  if (e.target === settingsOverlay) closeSettings();
});

function closeSettings() {
  settingsOverlay.classList.remove('show');
}

// 文件上传
uploadArea.addEventListener('click', () => avatarFileInput.click());

uploadArea.addEventListener('dragover', (e) => {
  e.preventDefault();
  uploadArea.style.borderColor = 'rgba(255,143,171,.7)';
});
uploadArea.addEventListener('dragleave', () => {
  uploadArea.style.borderColor = '';
});
uploadArea.addEventListener('drop', (e) => {
  e.preventDefault();
  uploadArea.style.borderColor = '';
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) handleFile(file);
});

avatarFileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) handleFile(file);
});

function handleFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    pendingAvatarSrc = e.target.result;
    uploadArea.classList.add('has-image');
    uploadArea.innerHTML = '<img class="preview-img" src="' + pendingAvatarSrc + '" alt="预览">';
  };
  reader.readAsDataURL(file);
}

// 确认生成
btnConfirm.addEventListener('click', () => {
  userName = nameInput.value.trim();

  if (pendingAvatarSrc) {
    avatarImg.src = pendingAvatarSrc;
    // 保存到 localStorage
    try { localStorage.setItem('pig_avatar', pendingAvatarSrc); } catch(e) {}
  }

  if (userName) {
    try { localStorage.setItem('pig_name', userName); } catch(e) {}
  } else {
    try { localStorage.removeItem('pig_name'); } catch(e) {}
  }

  updatePrefix();
  closeSettings();

  // 粒子爆炸庆祝
  spawnBurst(40);
  sfx.init();
  sfx.resume();
  sfx.burst();
});

// ============================================================
// Web Audio 8-bit 音效引擎
// ============================================================
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.lastTime = 0;
    this.noteIdx = 0;
  }
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
  }
  resume() {
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }

  ping() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const gap = Date.now() - this.lastTime;
    this.lastTime = Date.now();

    if (gap < 420) {
      this.noteIdx++;
    } else {
      this.noteIdx = 0;
    }

    const pent = [0, 2, 4, 7, 9];
    const oct = Math.floor(this.noteIdx / 5);
    const semitone = pent[this.noteIdx % 5];
    const freq = 523.25 * Math.pow(2, (semitone + oct * 12) / 12);

    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.22, now);
    gain.gain.exponentialRampToValueAtTime(0.005, now + 0.11);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.14);
  }

  burst() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const len = 0.07;
    const sr = this.ctx.sampleRate;
    const buf = this.ctx.createBuffer(1, sr * len, sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.5);
    }
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.10, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + len);
    src.connect(gain);
    gain.connect(this.ctx.destination);
    src.start(now);
  }
}

const sfx = new SoundEngine();

// ============================================================
// Canvas 粒子系统
// ============================================================
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, avatarR;

const PALETTE = [
  '#FFB3C6', '#FFC8A0', '#FFE0B8', '#E8B8D0', '#C8A8E0',
  '#B8C8F0', '#A0D8D0', '#FFD8A0', '#F0A8B8', '#D0B8E8',
  '#FFC0D0', '#E0C8F0', '#C0E0D8', '#FFB8D0', '#F8C8B0',
];

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  const rect = avatarZone.getBoundingClientRect();
  cx = rect.left + rect.width / 2;
  cy = rect.top + rect.height / 2;
  avatarR = Math.min(rect.width, rect.height) / 2;
}
window.addEventListener('resize', resize);
resize();

class Particle {
  constructor(type, opts = {}) {
    this.type = type;
    this.x = opts.x || Math.random() * W;
    this.y = opts.y || Math.random() * H;
    this.vx = opts.vx || 0;
    this.vy = opts.vy || 0;
    this.size = opts.size || (1.5 + Math.random() * 3.5);
    this.color = opts.color || PALETTE[Math.floor(Math.random() * PALETTE.length)];
    this.opacity = opts.opacity || (0.25 + Math.random() * 0.4);
    this.life = 1;
    this.decay = opts.decay || (0.0003 + Math.random() * 0.0008);
    this.phase = Math.random() * Math.PI * 2;
    this.amp = opts.amp || (0.3 + Math.random() * 1.5);
  }

  update() {
    if (this.type === 'ambient') {
      this.vx += Math.sin(this.phase + performance.now() * 0.001) * 0.015;
      this.vy += Math.cos(this.phase + performance.now() * 0.0013) * 0.015;
      this.vx *= 0.998;
      this.vy *= 0.998;
      this.x += this.vx;
      this.y += this.vy;
      if (this.x < -20) this.x = W + 20;
      if (this.x > W + 20) this.x = -20;
      if (this.y < -20) this.y = H + 20;
      if (this.y > H + 20) this.y = -20;
      this.opacity = 0.18 + Math.sin(this.phase + performance.now() * 0.002) * 0.1;
    } else if (this.type === 'burst') {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.96;
      this.vy *= 0.96;
      this.life -= this.decay;
      this.size *= 0.995;
    }
  }

  draw(ctx) {
    const alpha = this.type === 'burst'
      ? Math.max(0, this.life * this.opacity)
      : Math.max(0.08, this.opacity);
    ctx.beginPath();
    ctx.arc(this.x, this.y, Math.max(0.3, this.size), 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.globalAlpha = alpha;
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  alive() {
    return this.type === 'ambient' || this.life > 0.02;
  }
}

let particles = [];
const AMBIENT_COUNT = 80;

function initAmbient() {
  for (let i = 0; i < AMBIENT_COUNT; i++) {
    particles.push(new Particle('ambient'));
  }
}
initAmbient();

function spawnBurst(count = 28) {
  resize();
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2.5 + Math.random() * 8;
    const vx = Math.cos(angle) * speed;
    const vy = Math.sin(angle) * speed;
    const color = PALETTE[Math.floor(Math.random() * PALETTE.length)];
    particles.push(new Particle('burst', {
      x: cx, y: cy,
      vx, vy,
      size: 2 + Math.random() * 6,
      color,
      opacity: 0.6 + Math.random() * 0.4,
      decay: 0.012 + Math.random() * 0.025,
    }));
  }
}

function render() {
  ctx.clearRect(0, 0, W, H);

  const t = performance.now() * 0.0003;
  const g1 = ctx.createRadialGradient(
    W * 0.5 + Math.sin(t) * W * 0.08,
    H * 0.45 + Math.cos(t * 1.3) * H * 0.06,
    W * 0.06,
    W * 0.5, H * 0.5, W * 1.2
  );
  g1.addColorStop(0, 'rgba(255,180,200,0.18)');
  g1.addColorStop(0.25, 'rgba(255,220,180,0.10)');
  g1.addColorStop(0.5, 'rgba(210,180,230,0.06)');
  g1.addColorStop(0.75, 'rgba(180,200,235,0.04)');
  g1.addColorStop(1, 'rgba(255,245,235,0)');
  ctx.fillStyle = g1;
  ctx.fillRect(0, 0, W, H);

  const g2 = ctx.createRadialGradient(
    W * 0.35, H * 0.6, W * 0.03,
    W * 0.45, H * 0.55, W * 0.8
  );
  g2.addColorStop(0, 'rgba(200,160,220,0.10)');
  g2.addColorStop(0.4, 'rgba(180,190,225,0.05)');
  g2.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g2;
  ctx.fillRect(0, 0, W, H);

  particles = particles.filter(p => {
    p.update();
    return p.alive();
  });

  const ambientNow = particles.filter(p => p.type === 'ambient').length;
  if (ambientNow < AMBIENT_COUNT - 5) {
    for (let i = 0; i < AMBIENT_COUNT - ambientNow; i++) {
      particles.push(new Particle('ambient'));
    }
  }

  for (const p of particles) {
    p.draw(ctx);
  }

  requestAnimationFrame(render);
}
render();

// ============================================================
// 交互逻辑
// ============================================================
avatarZone.addEventListener('click', (e) => {
  e.preventDefault();

  sfx.init();
  sfx.resume();

  const newTitle = randomTitle(currentTitle);
  setTitle(newTitle);
  clickCount++;

  sfx.ping();
  if (clickCount > 0 && clickCount % 5 === 0) {
    sfx.burst();
  }

  spawnBurst(26 + Math.floor(Math.random() * 12));

  avatarZone.classList.remove('bounce');
  void avatarZone.offsetWidth;
  avatarZone.classList.add('bounce');

  startAuto();

  if (clickCount >= 3) {
    hintText.style.opacity = '0';
  }
});

avatarZone.addEventListener('touchstart', (e) => {
  e.preventDefault();
  avatarZone.click();
}, { passive: false });

// ============================================================
// 初始化：从 localStorage 或 URL 参数加载
// ============================================================
function init() {
  // URL 参数支持: ?name=xxx&avatar=xxx
  const params = new URLSearchParams(window.location.search);
  const urlName = params.get('name');
  const urlAvatar = params.get('avatar');

  // localStorage 恢复
  const savedName = localStorage.getItem('pig_name') || '';
  const savedAvatar = localStorage.getItem('pig_avatar') || '';

  userName = urlName || savedName;

  const avatarSrc = urlAvatar || savedAvatar || DEFAULT_AVATAR;
  avatarImg.src = avatarSrc;

  updatePrefix();
  startAuto();

  // 如果没有任何配置，自动弹出设置面板
  if (!userName && !savedAvatar && !urlName && !urlAvatar) {
    setTimeout(() => {
      settingsOverlay.classList.add('show');
      setTimeout(() => nameInput.focus(), 350);
    }, 600);
  }
}

init();
</script>
